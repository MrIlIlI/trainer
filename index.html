в 3 года.","gist":"Техническое диагностирование бака-аккумулятора","figure":"не реже 1 раза в 3 года"},"207":{"why":"Предельный коррозионный износ бака: кровля и днище — 50% проектной толщины, несущие конструкции покрытия и окрайки днища — 30%, нижняя половина стенок — 20% (п. 320 ПТЭ, приказ № 511).","trap":"У кровли и днища — 50%, а не 30%: именно эту цифру меняют неверные варианты.","hook":"Лесенка по убыванию: 50 — 30 — 20.","gist":"Предельный коррозионный износ бака","figure":"кровля и днище 50%, покрытие и окрайки 30%, нижняя половина стенок 20%"},"208":{"why":"Арматуре на подающем трубопроводе (паропроводе) дают нечётный номер, а парной ей на обратном (конденсатопроводе) — следующий за ним чётный (п. 324 ПТЭ, приказ № 511).","trap":"Обрати внимание: подающий — нечётный, обратный — следующий чётный, а не наоборот.","hook":null},"209":{"why":"Лишнее здесь — расположение попутных дренажей и водовыпусков: в технологических схемах тепловых сетей его не указывают (п. 326 ПТЭ, приказ № 511).","trap":null,"hook":null},"210":{"why":"Газоопасные камеры и проходные каналы на плане-схеме, оперативных и технологических схемах тепловых сетей выделяют жёлтым цветом (п. 329 ПТЭ, приказ № 511).","trap":null,"hook":null},"211":{"why":"Трубопроводы и сосуды тепловых сетей под избыточным давлением освидетельствуют не реже раза в год, в межотопительный период (п. 329 ПТЭ, приказ № 511).","trap":"Не раз в 2 или 3 года в отопительный период, а раз в год — в межотопительный.","hook":"Раз в год, пока отопление отдыхает.","gist":"Освидетельствование оборудования тепловых сетей","figure":"не реже 1 раза в год, в межотопительный период"},"212":{"why":"Внеочередное освидетельствование не нужно, если оборудование тепловых сетей ремонтировали без сварки и наплавки (п. 330 ПТЭ, приказ № 511).","trap":"Всё решает слово «без»: ремонт со сваркой или наплавкой, наоборот, требует внеочередного освидетельствования.","see":[216],"hook":null},"213":{"why":"Если сосуд тепловой сети не включали в работу больше 12 месяцев, проводят его внеочередное техническое освидетельствование (п. 330 ПТЭ, приказ № 511).","trap":null,"hook":null},"214":{"why":"Если трубопровод тепловой сети не включали в работу больше 24 месяцев, проводят его внеочередное техническое освидетельствование (п. 330 ПТЭ, приказ № 511).","trap":"Не пропаривание, а внеочередное освидетельствование — как у сосуда, только срок у трубопровода 24 месяца, а не 12.","see":[213],"hook":null},"215":{"why":"Если оборудование тепловой сети демонтировали и установили на новом месте, проводят его внеочередное техническое освидетельствование (п. 330 ПТЭ, приказ № 511).","trap":null,"hook":null},"216":{"why":"После ремонта оборудования тепловой сети со сваркой или наплавкой проводят его внеочередное техническое освидетельствование (п. 330 ПТЭ, приказ № 511).","trap":null,"hook":null},"217":{"why":"Если проект предусматривает систему ОДК увлажнения изоляции и она исправна, интервал освидетельствования трубопроводов можно увеличить максимум до 5 лет (п. 331 ПТЭ, приказ № 511).","trap":"В цифре: максимум 5 лет, а не 7 и не 10.","hook":"С ОДК — максимум пятилетка.","gist":"Интервал освидетельствования трубопроводов с ОДК","figure":"до 5 лет"},"218":{"why":"Минимальное пробное давление для трубопроводов тепловых сетей — 1,25 рабочего, но не меньше 0,2 МПа, если в проекте и документации изготовителя не указано иное (п. 333 ПТЭ, приказ № 511).","trap":"Коэффициент 1,25, а не 1,5: «1,5 рабочего, но не менее 0,2 МПа» — это котлы с рабочим давлением не более 0,5 МПа.","see":[194],"hook":"1,25 — как у сосудов, плюс нижняя планка 0,2 МПа.","gist":"Минимальное пробное давление трубопроводов тепловых сетей","figure":"не менее 1,25 рабочего, но не менее 0,2 МПа"},"219":{"why":"Из защит при эксплуатации насосных станций лишняя — от превышения температуры воды до насосных станций смешения (п. 381 ПТЭ, приказ № 511).","trap":null,"hook":null},"220":{"why":"Пришёл сигнал об обесточивании автоматизированной насосной станции — персонал должен проверить её незамедлительно (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"221":{"why":"Если основной насосный агрегат отключился и от автоматического ввода резерва включился резервный, персонал должен проверить станцию незамедлительно (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"222":{"why":"Сигнал о нагреве подшипников или электродвигателя сверх допустимого — персонал должен незамедлительно проверить насосную станцию (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"223":{"why":"При сигнале о затоплении помещения насосной станции персонал должен проверить станцию незамедлительно (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"224":{"why":"Пришёл сигнал о срабатывании защитных или блокировочных систем — персонал должен незамедлительно проверить насосную станцию (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"225":{"why":"При сигнале об аварийном отключении автоматизированной насосной станции персонал должен проверить её незамедлительно (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"226":{"why":"Сигнал о срабатывании пожарной сигнализации на автоматизированной насосной станции — персонал должен проверить станцию незамедлительно (п. 384 ПТЭ, приказ № 511).","trap":null,"hook":null},"227":{"why":"Лишнее для подкачивающих (перекачивающих) насосных станций — «постоянство заданного коэффициента смешения» (п. 389 ПТЭ, приказ № 511).","trap":"Не путай с подпиткой верхних зон: там лишнее — давление во всасывающих коллекторах, а здесь — коэффициент смешения.","see":[229],"hook":null},"228":{"why":"Лишнее для насосных станций смешения — заданное статическое давление в верхней зоне при работе регулятора подпитки (п. 389 ПТЭ, приказ № 511).","trap":"Не путай с подкачивающими станциями: там лишнее — коэффициент смешения, а здесь — статическое давление в верхней зоне.","see":[227],"hook":null},"229":{"why":"Лишнее для станций подпитки верхних зон при рассечке сети — заданное давление во всасывающих коллекторах подкачивающих (перекачивающих) насосов (п. 389 ПТЭ, приказ № 511).","trap":null,"hook":null},"230":{"why":"Значение должно быть не меньше чем на 0,05 МПа выше статического давления систем отопления, присоединённых к тепловой сети по зависимой схеме (п. 397 ПТЭ, приказ № 511).","trap":"Обрати внимание: «не менее чем на 0,05 МПа больше», а не «не более чем на 0,05 МПа меньше».","hook":null,"gist":"Превышение над статическим давлением систем отопления","figure":"не менее чем на 0,05 МПа больше статического"},"231":{"why":"Тепловой пункт отключают по сетевой воде так: по очереди закрывают запорную арматуру, начиная с подающего трубопровода (п. 398 ПТЭ, приказ № 511).","trap":"Не путай с включением: там открывают, начиная с обратного, а отключают — закрывая, начиная с подающего.","see":[232],"hook":null},"232":{"why":"Тепловой пункт включают по сетевой воде так: по очереди открывают запорную арматуру, начиная с обратного трубопровода (п. 398 ПТЭ, приказ № 511).","trap":"Не путай с отключением: там закрывают, начиная с подающего, а включают — открывая, начиная с обратного.","see":[231],"hook":null},"233":{"why":"Вопрос на исключение: не выполняют как раз ревизию оборудования, которое не указано в плане подготовки к работе в отопительный период (п. 404 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «не указанного в плане подготовки».","hook":null},"234":{"why":"Вопрос на исключение: лишнее здесь — гидравлическая плотность и отсутствие перетоков с оговоркой «включая теплообменные аппараты смесительного типа» (п. 407 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «включая»: при обходах плотность контролируют «за исключением» аппаратов смесительного типа.","see":[239],"hook":null},"235":{"why":"При обходах и осмотрах теплообменных аппаратов контролируют гидравлическое сопротивление по греющей и нагреваемой воде (п. 407 ПТЭ, приказ № 511).","trap":"Плотность «включая … смесительного типа» — это ответ на обратный вопрос: что не контролируют.","see":[234],"hook":null},"236":{"why":"Температуру, давление и расход теплоносителя по греющей и нагреваемой средам контролируют при обходах и осмотрах теплообменных аппаратов (п. 407 ПТЭ, приказ № 511).","trap":null,"hook":null},"237":{"why":"Фактическую производительность теплообменных аппаратов контролируют при обходах и осмотрах (п. 407 ПТЭ, приказ № 511).","trap":null,"hook":null},"238":{"why":"Гидравлическое сопротивление по греющей и нагреваемой воде контролируют при обходах и осмотрах теплообменных аппаратов (п. 407 ПТЭ, приказ № 511).","trap":null,"hook":null},"239":{"why":"Гидравлическую плотность и отсутствие перетоков между греющей и нагреваемой средами (кроме аппаратов смесительного типа) контролируют при обходах и осмотрах (п. 407 ПТЭ, приказ № 511).","trap":null,"hook":null},"240":{"why":"Если греющая среда — пар, при эксплуатации дополнительно контролируют уровень конденсата и работу устройств автоматического поддержания уровня и сброса (пп. 407–408 ПТЭ, приказ № 511).","trap":null,"hook":null},"241":{"why":"Если греющая среда — пар, при эксплуатации дополнительно контролируют отвод неконденсирующихся газов из парового пространства (пп. 407–408 ПТЭ, приказ № 511).","trap":null,"hook":null},"242":{"why":"Если греющая среда — пар, при эксплуатации дополнительно контролируют температурный напор (пп. 407–408 ПТЭ, приказ № 511).","trap":null,"hook":null},"243":{"why":"Если греющая среда — пар, при эксплуатации дополнительно контролируют гидравлическую плотность по качеству конденсата греющего пара (пп. 407–408 ПТЭ, приказ № 511).","trap":null,"hook":null},"244":{"why":"Запорную арматуру можно использовать как регулирующую в случае пуска паровой тепловой сети (п. 416 ПТЭ, приказ № 511).","trap":"Не путай с неисправными предохранительными клапанами: там «не допускается в любом случае», а здесь — пуск паровой сети.","see":[247],"hook":null},"245":{"why":"При рабочем давлении более 0,5 МПа предохранительные клапаны настраивают так, чтобы давление в защищённом элементе превышало избыточное рабочее не более чем на 10% (п. 417 ПТЭ, приказ № 511).","trap":"Не путай: до 0,5 МПа — превышение не больше 0,05 МПа, а более 0,5 МПа — не больше 10%.","see":[246],"hook":"10% от 0,5 МПа — ровно 0,05 МПа: на границе обе нормы совпадают.","gist":"Настройка клапанов: давление более 0,5 МПа","figure":"превышение не более чем на 10%"},"246":{"why":"При рабочем давлении до 0,5 МПа предохранительные клапаны настраивают так, чтобы давление в защищённом элементе превышало избыточное рабочее не более чем на 0,05 МПа (п. 417 ПТЭ, приказ № 511).","trap":"Не путай: более 0,5 МПа — превышение не больше 10%, а до 0,5 МПа — не больше 0,05 МПа.","see":[245],"hook":"0,05 МПа — это ровно 10% от 0,5 МПа: на границе обе нормы совпадают.","gist":"Настройка клапанов: давление до 0,5 МПа","figure":"превышение не более чем на 0,05 МПа"},"247":{"why":"Котлы, трубопроводы и сосуды с недействующими, неисправными, неотрегулированными или неопломбированными предохранительными клапанами эксплуатировать нельзя ни в каком случае (п. 417 ПТЭ, приказ № 511).","trap":"Не путай с запорной арматурой в роли регулирующей: там — при пуске паровой сети, а здесь — ни в каком случае.","see":[244],"hook":null},"248":{"why":"На оборудовании с рабочим давлением до 1,4 МПа оперативный персонал проверяет исправность клапанов кратковременным подрывом не реже 1 раза в смену (п. 417 ПТЭ, приказ № 511).","trap":"Не путай: до 1,4 МПа — раз в смену, а выше 1,4 МПа — раз в сутки.","see":[249],"hook":null,"gist":"Подрыв клапанов: давление до 1,4 МПа","figure":"не реже 1 раза в смену"},"249":{"why":"На оборудовании с рабочим давлением выше 1,4 МПа оперативный персонал проверяет исправность клапанов кратковременным подрывом не реже 1 раза в сутки (п. 417 ПТЭ, приказ № 511).","trap":"Не путай: выше 1,4 МПа — раз в сутки, а до 1,4 МПа — раз в смену.","see":[248],"hook":null,"gist":"Подрыв клапанов: давление выше 1,4 МПа","figure":"не реже 1 раза в сутки"},"250":{"why":"Если изготовитель клапана не установил иное, плотность клапанов проверяют и давление срабатывания регулируют не реже 1 раза в 12 месяцев (п. 417 ПТЭ, приказ № 511).","trap":"В цифре: не 18 и не 24 месяца, а 12.","hook":"Подрыв — смена или сутки, а плотность и настройка — раз в 12 месяцев.","gist":"Плотность и регулировка клапанов","figure":"не реже 1 раза в 12 месяцев"},"251":{"why":"Вопрос на исключение: неверно как раз утверждение, что внеочередное освидетельствование трубопроводов нужно после ремонта без сварки, наплавки и термообработки (п. 424 ПТЭ, приказ № 511).","trap":"Всё решает слово «без»: после ремонта со сваркой внеочередное освидетельствование как раз проводят.","see":[252],"hook":null},"252":{"why":"После ремонта трубопроводов (не тепловых сетей) со сваркой, наплавкой, термообработкой элементов под давлением проводят внеочередное техническое освидетельствование (п. 424 ПТЭ, приказ № 511).","trap":"Обрати внимание: не «очередное», а «внеочередное».","hook":null},"253":{"why":"Если трубопроводы (не тепловых сетей) не эксплуатировались больше 24 месяцев, в том числе стояли в консервации, проводят внеочередное техническое освидетельствование (п. 424 ПТЭ, приказ № 511).","trap":"Обрати внимание: не «первичное», а «внеочередное».","hook":null},"254":{"why":"После ремонта со сваркой наружный осмотр и гидравлические испытания трубопровода проводят до наложения тепловой изоляции на отремонтированные участки (п. 425 ПТЭ, приказ № 511).","trap":"Всё решает предлог: не «после» и не «совместно с», а «до» наложения изоляции.","hook":null},"255":{"why":"Наружный осмотр в два этапа — в холодном и горячем состоянии — нужен, чтобы проверить, нет ли защемлений трубопровода, которые мешают ему перемещаться при тепловом расширении (п. 425 ПТЭ, приказ № 511).","trap":null,"hook":null},"256":{"why":"Капли в разъёмных соединениях допустимы, если отдельные капли не увеличиваются в размерах при выдержке времени (п. 429 ПТЭ, приказ № 511).","trap":null,"hook":null},"257":{"why":"Теплопотребляющие установки отключают так: по очереди закрывают запорную арматуру, начиная с подающего трубопровода (п. 432 ПТЭ, приказ № 511).","trap":"Не путай с включением: там открывают, начиная с обратного, а отключают — закрывая, начиная с подающего.","see":[258],"hook":null},"258":{"why":"Теплопотребляющие установки включают так: по очереди открывают запорную арматуру, начиная с обратного трубопровода (п. 432 ПТЭ, приказ № 511).","trap":"Не путай с отключением: там закрывают, начиная с подающего, а включают — открывая, начиная с обратного.","see":[257],"hook":null},"259":{"why":"Пробное давление при испытаниях на прочность и плотность — не меньше 1,25 рабочего, но и не меньше 0,2 МПа (п. 435 ПТЭ, приказ № 511).","trap":"В цифрах: 1,25 рабочего и минимум 0,2 МПа — не 1,5 рабочего, не 0,3 и не 0,5 МПа.","hook":"1,25 — это рабочее плюс четверть, но не меньше 0,2 МПа.","gist":"Пробное давление при испытаниях","figure":"не менее 1,25 рабочего, но не менее 0,2 МПа"},"260":{"why":"Оборудование и системы выдержали гидравлическое испытание, если за 5 мин давление упало от пробного не больше чем на 0,02 МПа (п. 438 ПТЭ, приказ № 511).","trap":"Следи за цифрами: в ответе 5 мин и 0,02 МПа, а 10 мин и 0,01 МПа — из варианта про панельное отопление.","hook":"Пять минут — две сотых.","gist":"Когда гидроиспытание выдержано","figure":"падение за 5 мин не более 0,02 МПа"},"261":{"why":"Акт по результатам гидравлических испытаний на прочность и плотность утверждает технический руководитель эксплуатирующей организации (п. 439 ПТЭ, приказ № 511).","trap":"Обрати внимание: не просто «руководитель», а «технический руководитель».","hook":null},"262":{"why":"Если испытания не пройдены, нужно найти и устранить утечки и дефекты, а затем провести испытания повторно (п. 439 ПТЭ, приказ № 511).","trap":"Разница в концовке: после устранения дефектов — не запуск в работу, а повторные испытания.","hook":null},"263":{"why":"В точке поставки отклонение средневзвешенной за сутки температуры в подающем трубопроводе от температурного графика из договора — не более ±3% (п. 440 ПТЭ, приказ № 511).","trap":null,"hook":null,"gist":"Отклонение температуры в подающем трубопроводе","figure":"не более ±3% от температурного графика"},"264":{"why":"Первую помощь нельзя оказывать прямо на месте происшествия, если там есть факторы, угрожающие жизни и здоровью того, кто её оказывает (пп. 3–4 Порядка первой помощи, 220н).","trap":"Не спутай с вариантом «Непосредственно на месте происшествия»: всё решает условие про угрозу самому помогающему.","hook":null},"265":{"why":"Первую помощь не оказывают, если человек или его законный представитель отказался от неё ещё до начала её оказания (п. 5 Порядка первой помощи, 220н).","trap":null,"hook":null},"266":{"why":"Первую помощь оказывать можно, если человек или его законный представитель не отказался от неё до начала её оказания (п. 5 Порядка первой помощи, 220н).","trap":null,"hook":null},"267":{"why":"Если пострадавших двое и больше, очерёдность определяют по тяжести их состояния, а приоритет отдают детям, то есть несовершеннолетним (п. 8 Порядка первой помощи, 220н).","trap":null,"hook":null},"268":{"why":"Вопрос на исключение: нельзя использовать укладки и аптечки, требования к комплектации которых утверждает МЧС России (пп. 9–10 Порядка первой помощи, 220н).","trap":"Два варианта различаются только ведомством: лишнее — аптечки по требованиям МЧС, а не Минздрава.","hook":null},"269":{"why":"Верная последовательность — 9 шагов: от оценки обстановки и обеспечения безопасности до вызова скорой, если её не вызвали раньше, и передачи пострадавшего бригаде (прил. 2 к Порядку первой помощи, 220н).","trap":null,"hook":null,"gist":"Последовательность первой помощи","figure":"9 шагов, начиная с оценки обстановки"},"270":{"why":"Сюда входят определение и устранение угроз, своя безопасность (в том числе перчатки и маска), устное сообщение о готовности помогать — вплоть до перемещения пострадавшего в безопасное место (прил. 2 к Порядку первой помощи, 220н).","trap":null,"hook":null,"gist":"Оценка обстановки: что входит","figure":"заканчивается 8) — перемещением в безопасное место"},"271":{"why":"Первый способ — прямое давление на рану; если кровотечение остановлено — давящая повязка, а если давление невозможно, опасно или неэффективно — давящая повязка и (или) жгут (прил. 2 к Порядку первой помощи, 220н).","trap":null,"hook":null,"gist":"Остановка наружного кровотечения","figure":"4 пункта, первый — прямое давление на рану"},"272":{"why":"Нет признаков жизни: позвать окружающих, вызвать скорую, СЛР на твёрдой ровной поверхности, дефибриллятор (при наличии), а при появлении признаков жизни — поддерживать проходимость дыхательных путей (прил. 2 к Порядку первой помощи, 220н).","trap":null,"hook":"Нет признаков жизни — СЛР; есть, но нет сознания — боковое положение.","gist":"СЛР: признаков жизни нет","figure":"5 шагов, первый — позвать окружающих на помощь"},"273":{"why":"Признаки жизни есть, сознания нет: устойчивое боковое положение, а если это невозможно — запрокинуть и удерживать голову с подъёмом подбородка, затем вызвать скорую, если её ещё не вызвали (прил. 2 к Порядку первой помощи, 220н).","trap":"Не путай: СЛР и дефибриллятор — когда признаков жизни нет, а тут они есть, нет только сознания.","see":[272],"hook":null,"gist":"Признаки жизни есть, сознания нет","figure":"3 пункта, первый — устойчивое боковое положение"},"274":{"why":"Подробный осмотр — это опрос пострадавшего и осмотр головы, шеи, груди, спины, живота и таза, конечностей (прил. 2 к Порядку первой помощи, 220н).","trap":null,"hook":"Сначала спроси, потом осмотри — от головы до конечностей.","gist":"Подробный осмотр и опрос","figure":"7 пунктов: опрос и осмотр от головы до конечностей"},"275":{"why":"Вопрос на исключение: к подробному осмотру и опросу не относится набор с осмотром на кровотечения, клистированием, гипсовыми повязками и укрытием тканью с холодом (прил. 2 к Порядку первой помощи, 220н).","trap":"Не путай: опрос и осмотр от головы до конечностей — это и есть подробный осмотр, а не лишнее.","see":[274],"hook":null,"gist":"Что не входит в подробный осмотр","figure":"4 пункта, среди них клистирование и гипс"},"276":{"why":"Вопрос на исключение: не допускается вариант, где при судорожном приступе с потерей сознания голову оберегают, препятствуя судорожным движениям (прил. 2 к Порядку первой помощи, 220н).","trap":"Всё решает слово «препятствуя» судорожным движениям.","hook":null}}</script>

  /* ================= Вопрос ================= */
  function streakText() { return 'Серия ' + S.streak; }
  function renderPlay() {
    var sess = current();
    if (!sess) { go('', true); return; }
    var exam = sess.mode === 'exam';
    if (exam && Date.now() >= sess.deadline) { finishExam(sess, true); return; }
    if (sess.pos >= sess.items.length) { if (exam) finishExam(sess, false); else finish(sess); return; }
    var item = sess.items[sess.pos], q = Q.get(item.id);
    if (!sess.cur || sess.cur.pos !== sess.pos || sess.cur.id !== item.id) {
      sess.cur = { pos: sess.pos, id: item.id, rep: !!item.rep, perm: shuffle(range(q.options.length)), picked: null, res: null };

    }

      h('div', { class: 'bar-row' },
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'На главную', title: 'На главную', onclick: leavePlay }, icon('back')),
        h('div', { class: 'bar-title' }, h('span', { class: 't' }, MODE[sess.mode]), h('span', { class: 'count' }, 'Вопрос ' + (sess.pos + 1) + ' из ' + total)),
        h('div', { class: 'chips-r' }, ui.chip, ui.pts)),

        h('i', { style: 'width:' + (sess.pos * 100 / total) + '%' })));
    var meta = h('div', { class: 'qmeta' }, h('span', { class: 'tag' }, TTAG[TK.get(q.id)]), h('span', null, '№ ' + q.id), c.rep ? h('span', { class: 'tag rep' }, 'Повтор') : null);

  function leavePlay() {
    var sess = current();
    if (sess && sess.mode === 'exam') {
      confirmBox('Выйти из экзамена?', 'Попытка останется открытой, но таймер не остановится. Вернуться можно с главного экрана.', 'Выйти', goHome);
      return;
    }
    goHome();
  }

  function startTimer(sess, chip) {
    function tick() {
      var left = sess.deadline - Date.now();
      if (left <= 0) { clearInterval(timerId); timerId = null; finishExam(sess, true); return; }
      chip.textContent = fmtMs(left);
      chip.classList.toggle('warn', left < 120000);
      chip.setAttribute('aria-label', 'Осталось ' + fmtMs(left));
    }
    tick();
    timerId = setInterval(tick, 1000);
  }

  function pick(i) {
    if (!PLAY) return;
    var sess = PLAY.sess, c = sess.cur;
    if (i < 0 || i >= c.perm.length) return;
    if (sess.mode === 'exam') { c.picked = i; save(); paint(false); return; }
    if (c.res) return;
    commit(c.perm[i] === Q.get(c.id).correct_index ? 'ok' : 'bad', i);
  }
  function dunno() {
    if (!PLAY) return;
    var sess = PLAY.sess;
    if (sess.mode === 'exam' || sess.cur.res) return;
    commit('skip', null);
  }
  function commit(res, i) {
    var sess = PLAY.sess, c = sess.cur;
    c.picked = i;
    c.res = res;
    var out = applyAnswer(c.id, res, { rep: c.rep, round: sess.round, mode: sess.mode });
    c.out = out;
    sess.log.push({ id: c.id, rep: c.rep, res: res, pick: i == null ? null : c.perm[i], from: out.from, to: out.to, learned: out.learned, pts: out.pts });
    // ошибка — вопрос вернётся в этот же раунд через 3–5 других (в «Разведке» каждый вопрос идёт один раз)

      var n = sess.reps[c.id] || 0;
      if (n < 2) {
        var at = Math.min(sess.pos + 1 + randInt(3, 5), sess.items.length);
        sess.items.splice(at, 0, { id: c.id, rep: true });
        sess.reps[c.id] = n + 1;
        c.again = true;
      }
    }
    save();
    checkMiles();
    paint(true);
  }

  function fbMessage(sess, c) {
    var o = c.out || {};
    if (c.res === 'ok') {
      if (o.learned) return 'Этот вопрос теперь в выученных.';
      if (c.rep) return 'Теперь закрепили.';
      if (S.streak > 0 && S.streak % 5 === 0) return 'Уже ' + S.streak + ' подряд.';
      return pickOne(['Так и есть.', 'Всё верно.', 'Точно.']);
    }
    if (c.res === 'bad') {
      if (sess.mode === 'scout') return 'Не совсем. Вопрос остаётся в работе — разберём его в «Тренировке».';
      if (c.again) return c.rep ? 'Снова мимо — бывает. Покажу его ещё раз чуть позже.' : 'Не совсем. Тут легко перепутать — вернёмся к этому вопросу чуть позже.';
      return 'Не совсем. Вопрос остаётся в работе и вернётся в следующих раундах.';
    }
    if (sess.mode === 'scout') return 'Честно — так и надо. Вопрос уйдёт в «Тренировку».';
    if (c.again) return 'Ничего страшного, вот ответ. Вернёмся к нему чуть позже.';
    return 'Вот правильный ответ. Вопрос остаётся в работе.';
  }
  function boxLine(c) {
    var o = c.out;

    if (o.learned) return 'Коробка 2 → 3: выучен.';
    if (o.from === 1 && o.to === 2) return 'Коробка 1 → 2. Ещё один верный ответ в другом раунде — и выучен.';
    if (o.from === 2 && o.to === 2) return 'Коробка 2. Для перехода в выученные нужен верный ответ в другом раунде.';
    if (o.from === 3 && o.to === 3) return 'Остаётся в выученных.';

    }

    if (e.trap) box.appendChild(sec('Ловушка', e.trap, 'trap'));

  function paint(justAnswered) {
    var sess = PLAY.sess, ui = PLAY.ui, c = sess.cur, q = Q.get(c.id), exam = sess.mode === 'exam';
    ui.opts.forEach(function (b, i) {

  function next() {

    var sess = PLAY.sess, c = sess.cur;
    if (sess.mode === 'exam') {

  function finish(sess) {
    var first = sess.log.filter(function (l) { return !l.rep; }), reps = sess.log.filter(function (l) { return l.rep; });
    function cnt(arr, r) { return arr.filter(function (l) { return l.res === r; }).length; }
    S.last = {
      mode: sess.mode, at: Date.now(), n: first.length, ok: cnt(first, 'ok'), bad: cnt(first, 'bad'), skip: cnt(first, 'skip'),

      toB1: sess.log.filter(function (l) { return l.from > 1 && l.to === 1; }).length,
      pts: sess.log.reduce(function (a, l) { return a + (l.pts || 0); }, 0),
      errors: first.filter(function (l) { return l.res !== 'ok'; }).map(function (l) { return { id: l.id, pick: l.pick, res: l.res }; })
    };
    if (sess.mode === 'scout') { S.scout = null; S.scoutDone = true; } else S.session = null;
    if (sess.mode === 'quick') S.quickDone = true;
    S.playing = null;
    save();
    go('done', true);
  }

  function finishExam(sess, timeUp) {
    var picks = {};
    (sess.picks || []).forEach(function (p) { picks[p.pos] = p.pick; });
    if (sess.cur && sess.cur.picked != null && picks[sess.cur.pos] === undefined) picks[sess.cur.pos] = sess.cur.perm[sess.cur.picked];
    var list = sess.items.map(function (it, pos) {
      var q = Q.get(it.id), p = picks[pos] === undefined ? null : picks[pos];
      return { id: it.id, pick: p, ok: p === q.correct_index };
    });
    var pts = 0, learned = 0;
    list.forEach(function (r) {
      if (r.pick == null) return; // без ответа — коробку не трогаем
      var o = applyAnswer(r.id, r.ok ? 'ok' : 'bad', { rep: false, round: sess.round, mode: 'exam', noStreak: true });
      pts += o.pts;
      if (o.learned) learned++;
    });
    var ok = list.filter(function (r) { return r.ok; }).length;
    var secs = Math.min(Math.round((Date.now() - sess.t0) / 1000), EXAM_MIN * 60);
    S.exams.push({ at: Date.now(), ok: ok, total: list.length, secs: secs });
    S.last = { mode: 'exam', at: Date.now(), ok: ok, total: list.length, secs: secs, timeUp: !!timeUp, pts: pts, learned: learned,
      unanswered: list.filter(function (r) { return r.pick == null; }).length,
      errors: list.filter(function (r) { return !r.ok; }).map(function (r) { return { id: r.id, pick: r.pick, res: r.pick == null ? 'none' : 'bad' }; }) };
    S.session = null;
    S.playing = null;
    save();
    checkMiles();
    if (route === 'done') render(); else go('done', true);
  }

  /* ================= Итоги ================= */
  function errorCard(err) {
    var q = Q.get(err.id), e = EXPL[err.id] || {};
    var yours = err.res === 'bad' && err.pick != null ? h('div', { class: 'ans wrong' }, h('div', null, h('small', null, 'Твой ответ'), q.options[err.pick]))
      : h('div', { class: 'ans none' }, h('div', null, err.res === 'skip' ? 'Ты нажал «Не знаю»' : 'Без ответа'));
    return h('article', { class: 'entry' },
      h('div', { class: 'qmeta' }, h('span', { class: 'tag' }, TTAG[TK.get(q.id)]), h('span', null, '№ ' + q.id)),
      qText(q.question, { neg: true }),
      yours,
      h('div', { class: 'ans right' }, h('div', null, h('small', null, 'Верный ответ'), q.correct_text)),
      notes(e));
  }
  function notes(e, toks) {
    var box = h('div', { class: 'notes' });
    if (e.why) { var p = h('p', null, h('b', null, 'Почему так. ')); hlAppend(p, e.why, toks); box.appendChild(p); }
    if (e.trap) { var t = h('p', { class: 'tr' }, h('b', null, 'Ловушка. ')); hlAppend(t, e.trap, toks); box.appendChild(t); }
    if (e.hook) { var k = h('p', null, h('b', null, 'Зацепка. ')); hlAppend(k, e.hook, toks); box.appendChild(k); }
    return box;
  }
  function backBar(title, sub) {
    return h('div', { class: 'bar' }, h('div', { class: 'bar-row' },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'На главную', title: 'На главную', onclick: goHome }, icon('back')),
      h('div', { class: 'bar-title' }, h('span', { class: 't' }, title), sub ? h('span', { class: 'count' }, sub) : null)));
  }
  // Длинные списки дорисовываем порциями: сами при прокрутке, а кнопка «Показать ещё» — запасной путь
  function lazyList(container, items, make, step) {
    step = step || 30;
    var i = 0, io = null;
    var sentinel = h('button', { class: 'btn btn-secondary btn-block', type: 'button', style: 'margin-top:12px' });
    sentinel.addEventListener('click', function () { more(); });
    container.appendChild(sentinel);
    function more() {
      var frag = document.createDocumentFragment(), end = Math.min(items.length, i + step);
      for (; i < end; i++) frag.appendChild(make(items[i], i));
      container.insertBefore(frag, sentinel);
      if (i >= items.length) { if (io) io.disconnect(); io = null; sentinel.remove(); }
      else sentinel.textContent = 'Показать ещё ' + Math.min(step, items.length - i) + ' из ' + (items.length - i);
    }
    if ('IntersectionObserver' in window) {
      more();
      if (i < items.length) {
        io = new IntersectionObserver(function (es) {
          if (!io || !es.some(function (x) { return x.isIntersecting; })) return;
          more();
          if (io) { io.unobserve(sentinel); io.observe(sentinel); }
        }, { rootMargin: '800px 0px' });
        io.observe(sentinel);
      }
    } else { step = items.length; more(); }
    disposers.push(function () { if (io) io.disconnect(); io = null; });
  }

  function renderDone() {
    var L = S.last;
    if (!L) { go('', true); return; }
    if (L.mode === 'exam') { renderExamResult(L); return; }
    var titles = { quick: 'Быстрый старт пройден', scout: 'Разведка закончена', train: 'Раунд пройден', numbers: 'Раунд по цифрам пройден', hard: 'Порция трудных пройдена', fix: 'Ошибки прогнаны' };
    var nodes = [backBar('Итоги')];
    var hero = h('div', { class: 'hero' }, h('h2', null, titles[L.mode] || 'Готово'));
    if (L.mode === 'scout') {
      hero.appendChild(h('div', { class: 'score' }, L.ok + ' из ' + L.n));
      hero.appendChild(h('p', { class: 'score-sub' }, 'знал сразу. Остальные ' + (L.n - L.ok) + ' — в коробке 1, они придут в «Тренировке».'));
    } else {
      hero.appendChild(h('div', { class: 'score' }, L.ok + ' из ' + L.n));
      hero.appendChild(h('p', { class: 'score-sub' }, 'верно с первого раза'));
    }
    nodes.push(hero);
    var kv = h('div', { class: 'kv' });
    function row(k, v) { kv.appendChild(h('span', null, k)); kv.appendChild(h('span', null, v)); }
    if (L.repN) row('Повторы', L.repOk + ' из ' + L.repN + ' верно');
    if (L.skip) row('«Не знаю»', String(L.skip));
    row('Выучено за раунд', '+' + L.learned);
    row('Перешли в коробку 2', '+' + L.toB2);
    if (L.toB1) row('Вернулись в коробку 1', String(L.toB1));
    row('Очки', '+' + L.pts + ' · всего ' + fmtNum(S.points));
    row('Серия', S.streak + ' · лучшая ' + S.best);
    nodes.push(h('div', { class: 'card' }, kv));

    var errs = L.errors || [];
    var acts = h('div', { class: 'actions' });
    var again = { quick: ['Ещё круг', startQuick], train: ['Ещё раунд', startTrain], numbers: ['Ещё раунд по цифрам', startNumbers], hard: ['Следующая порция', startHard],
      fix: ['Обычный раунд', startTrain], scout: ['К тренировке', startTrain] }[L.mode];
    if (L.mode === 'hard' && !stats().hard) again = null;
    var ns = nextStep();
    var merged = !!again && ns.act[1] === again[1]; // «ещё раунд» и «что дальше» ведут в одно место — одна кнопка
    if (errs.length) acts.appendChild(h('button', { class: 'btn btn-primary btn-block', type: 'button', onclick: function () { go('review', true); } }, 'Разобрать ошибки (' + errs.length + ')'));
    if (again && !merged) acts.appendChild(h('button', { class: 'btn ' + (errs.length ? 'btn-secondary' : 'btn-primary') + ' btn-block', type: 'button', onclick: again[1] }, again[0]));
    nodes.push(acts);
    nodes.push(h('section', { class: 'next', style: 'margin-top:16px' }, h('p', { class: 'eyebrow' }, 'Что дальше'), h('p', { class: 'say' }, ns.text),
      h('button', { class: 'btn ' + (merged && !errs.length ? 'btn-primary' : 'btn-secondary') + ' btn-block', type: 'button', onclick: ns.act[1] }, merged ? again[0] : ns.act[0])));
    nodes.push(h('div', { class: 'actions' }, h('button', { class: 'btn btn-ghost btn-block', type: 'button', onclick: goHome }, 'На главную')));
    mount(nodes, false);
  }

  function renderExamResult(L) {
    var nodes = [backBar('Экзамен', 'результат')];
    var m = Math.floor(L.secs / 60), s = L.secs % 60;
    nodes.push(h('div', { class: 'hero' }, h('h2', null, 'Пробный экзамен'),
      h('div', { class: 'score' }, L.ok + ' из ' + L.total + ' верно'),
      h('p', { class: 'score-sub' }, L.timeUp ? 'Время вышло' + (L.unanswered ? ': без ответа ' + nq(L.unanswered) + '.' : '.') : 'Время: ' + m + ' мин ' + s + ' с.')));
    var prev = S.exams.slice(-6, -1);
    if (prev.length) nodes.push(h('p', { class: 'score-sub' }, 'Прошлые попытки: ' + prev.map(function (x) { return x.ok + '/' + x.total; }).join(', ')));
    var errs = L.errors || [];
    if (!errs.length) nodes.push(h('p', { class: 'note-calm' }, 'Ошибок нет. Можно ещё раз пройти экзамен или заглянуть в «Трудные».'));
    else {
      nodes.push(h('h2', { class: 'sect-h' }, 'Разбор ошибок · ' + errs.length));
      var list = h('div');
      errs.forEach(function (e) { list.appendChild(errorCard(e)); });
      nodes.push(list);
    }
    var acts = h('div', { class: 'actions' });
    if (errs.length) acts.appendChild(h('button', { class: 'btn btn-secondary btn-block', type: 'button', onclick: function () {
      begin('fix', shuffle(errs.map(function (e) { return e.id; })));
    } }, 'Прогнать эти вопросы ещё раз'));
    acts.appendChild(h('button', { class: 'btn btn-primary btn-block', type: 'button', onclick: startExam }, 'Ещё попытка'));
    acts.appendChild(h('button', { class: 'btn btn-ghost btn-block', type: 'button', onclick: goHome }, 'На главную'));
    nodes.push(acts);
    mount(nodes, false);
  }

  function renderReview() {
    var L = S.last;
    if (!L || !(L.errors || []).length) { go('', true); return; }
    var errs = L.errors;
    var nodes = [backBar('Разбор ошибок', nq(errs.length))];
    nodes.push(h('p', { class: 'note-calm' }, 'Спокойно пройдись по списку: что выбрал ты, какой ответ верный и на чём легко споткнуться.'));
    var list = h('div');
    nodes.push(list);
    nodes.push(h('div', { class: 'actions' },
      h('button', { class: 'btn btn-primary btn-block', type: 'button', onclick: function () { begin('fix', shuffle(errs.map(function (e) { return e.id; }))); } }, 'Прогнать эти вопросы ещё раз'),
      h('button', { class: 'btn btn-ghost btn-block', type: 'button', onclick: goHome }, 'На главную')));
    mount(nodes, false);
    lazyList(list, errs, errorCard, 25);
  }

  /* ================= Шпаргалка ================= */
  var HAY = new Map();
  function hay(id) {
    if (!HAY.has(id)) {
      var q = Q.get(id), e = EXPL[id] || {};
      HAY.set(id, norm(['№' + id, q.question, q.correct_text, e.why || '', e.trap || '', e.hook || '', e.gist || '', e.figure || ''].join(' \n ')));
    }
    return HAY.get(id);
  }
  // Запрос режем по пробелам и дефисам, у длинных слов срезаем окончание: «наряд-допуск» найдёт «нарядом-допуском»
  var ENDING_RE = /(?:ами|ями|ого|его|ому|ему|ыми|ими|ах|ях|ам|ям|ом|ем|ой|ей|ий|ый|ая|яя|ое|ее|ые|ие|ую|юю|ов|ев|а|я|о|е|ы|и|у|ю|ь|й)$/;
  function tokens(query) {
    return norm(query).split(/[\s\-–—]+/).filter(Boolean).map(function (t) {
      if (/^[а-я]{5,}$/.test(t)) { var s = t.replace(ENDING_RE, ''); if (s.length >= 4) return s; }
      return t;
    });
  }
  function boxTag(id) {
    var s = peek(id);
    if (s.b === 3) return h('span', { class: 'tag b3' }, 'выучен');
    if (s.s === 0) return h('span', { class: 'tag' }, 'новый');
    return h('span', { class: 'tag b' + s.b }, 'коробка ' + s.b);
  }
  var cheat = { q: '', topic: 'all', hard: false };
  function renderCheat() {
    var input = h('input', { type: 'search', placeholder: 'Слова или числа: «0,6», «наряд-допуск»', 'aria-label': 'Поиск по вопросам и ответам', autocomplete: 'off', enterkeyhint: 'search' });
    input.value = cheat.q;
    var clr = h('button', { class: 'clr', type: 'button', 'aria-label': 'Очистить поиск' }, '×');
    var counts = { all: ALL.length, pte: POOL.pte.length, ot: POOL.ot.length, pp: POOL.pp.length };
    var labels = { all: 'Все', pte: 'ПТЭ', ot: 'Охрана труда', pp: 'Первая помощь' };
    var fbtns = ['all', 'pte', 'ot', 'pp'].map(function (k) {
      return h('button', { type: 'button', 'aria-pressed': String(cheat.topic === k), onclick: function () { cheat.topic = k; syncFilters(); update(); } }, labels[k] + ' ' + counts[k]);
    });
    var hardBtn = h('button', { type: 'button', 'aria-pressed': String(cheat.hard), onclick: function () { cheat.hard = !cheat.hard; syncFilters(); update(); } }, 'Только трудные');
    function syncFilters() {
      fbtns.forEach(function (b, i) { b.setAttribute('aria-pressed', String(['all', 'pte', 'ot', 'pp'][i] === cheat.topic)); });
      hardBtn.setAttribute('aria-pressed', String(cheat.hard));
    }
    var found = h('p', { class: 'found', 'aria-live': 'polite' });
    var list = h('div');
    var head = h('div', { class: 'searchbar' },
      h('div', { class: 'bar-row' },
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'На главную', title: 'На главную', onclick: goHome }, icon('back')),
        h('div', { class: 'bar-title' }, h('span', { class: 't' }, 'Шпаргалка'), h('span', { class: 'count' }, 'Все вопросы с верными ответами'))),
      h('div', { class: 'field' }, icon('search', 18), input, clr),
      h('div', { class: 'filters' }, fbtns, hardBtn));
    mount([head, found, list], false);

    var stopList = null, timer = null;
    function update() {
      var toks = tokens(cheat.q);
      var ids = ALL.filter(function (id) {
        if (cheat.topic !== 'all' && TK.get(id) !== cheat.topic) return false;
        if (cheat.hard && !isHard(id)) return false;
        var hs = hay(id);
        return toks.every(function (t) { return hs.indexOf(t) !== -1; });
      });
      found.textContent = toks.length || cheat.topic !== 'all' || cheat.hard ? 'Найдено: ' + ids.length : 'Всего ' + nq(ids.length) + '. Ищи по словам и числам.';
      if (stopList) stopList();
      clear(list);
      if (!ids.length) { list.appendChild(h('p', { class: 'empty' }, 'Ничего не нашлось. Попробуй другое слово или число без единиц измерения.')); return; }
      var before = disposers.length;
      lazyList(list, ids, function (id) { return cheatCard(id, toks); }, 30);
      var mine = disposers.splice(before, 1)[0];
      stopList = mine;
    }
    disposers.push(function () { if (stopList) stopList(); });
    input.addEventListener('input', function () {
      cheat.q = input.value;
      clearTimeout(timer);
      timer = setTimeout(update, 120);
    });
    clr.addEventListener('click', function () { input.value = ''; cheat.q = ''; update(); input.focus(); });
    update();
  }
  function cheatCard(id, toks) {
    var q = Q.get(id), e = EXPL[id] || {};
    var ans = h('div', { class: 'ans right' });
    hlAppend(ans.appendChild(h('div')), q.correct_text, toks);
    return h('article', { class: 'entry' },
      h('div', { class: 'qmeta' }, h('span', { class: 'tag' }, TTAG[TK.get(id)]), h('span', null, '№ ' + id), boxTag(id)),
      qText(q.question, { hl: toks.length ? toks : null }),
      ans,
      notes(e, toks));
  }

  /* ================= Цифры ================= */
  var numQ = '';
  function renderNumbers() {
    var st = stats();
    var inWork = NUMERIC.filter(function (id) { return peek(id).b !== 3; }).length;
    var input = h('input', { type: 'search', placeholder: 'Найти в таблице', 'aria-label': 'Поиск по таблице цифр', autocomplete: 'off' });
    input.value = numQ;
    var groups = h('div');
    var nodes = [backBar('Цифры', nq(NUMERIC.length) + ' с числами'),
      h('section', { class: 'card' },
        h('p', { style: 'margin:0 0 12px' }, 'Здесь только вопросы, где ответ завязан на число. Выучено ' + st.num + ' из ' + NUMERIC.length + (inWork ? ', в работе ' + inWork + '.' : '.')),
        h('button', { class: 'btn btn-primary btn-block', type: 'button', onclick: startNumbers }, 'Тренировка по цифрам · ' + Math.min(ROUND, NUMERIC.length))),
      h('h2', { class: 'sect-h' }, 'Таблица: суть — цифра'),
      h('div', { class: 'field' }, icon('search', 18), input),
      groups];
    mount(nodes, false);
    function update() {
      var toks = tokens(numQ);
      clear(groups);
      var total = 0;
      TOPICS.forEach(function (t) {
        var ids = NUMERIC.filter(function (id) { return TK.get(id) === t && toks.every(function (k) { return hay(id).indexOf(k) !== -1; }); });
        if (!ids.length) return;
        total += ids.length;
        var lst = h('div', { class: 'nlist' });
        ids.forEach(function (id) {
          var q = Q.get(id), e = EXPL[id] || {};
          var g = h('span', { class: 'g' }), f = h('span', { class: 'f' });
          hlAppend(g, e.gist || q.question, toks);
          hlAppend(f, e.figure || q.correct_text, toks);
          lst.appendChild(h('details', { class: 'nrow' },
            h('summary', null, g, f),
            h('div', { class: 'more' },
              h('div', { class: 'qmeta', style: 'margin-top:8px' }, h('span', null, '№ ' + id), boxTag(id)),
              qText(q.question, {}),
              h('div', { class: 'ans right' }, h('div', null, q.correct_text)),
              notes(e))));
        });
        groups.appendChild(h('div', { class: 'ngroup' }, h('h3', null, TNAME[t] + ' · ' + ids.length), lst));
      });
      if (!total) groups.appendChild(h('p', { class: 'empty' }, 'В таблице такого нет.'));
    }
    var timer = null;
    input.addEventListener('input', function () { numQ = input.value; clearTimeout(timer); timer = setTimeout(update, 120); });
    update();
  }

  /* ================= Клавиатура ================= */
  document.addEventListener('keydown', function (e) {
    if (route !== 'play' || !PLAY) return;
    if (document.querySelector('.overlay')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
    var k = e.key, sess = PLAY.sess, c = sess.cur;
    if (k && k.length === 1 && k >= '1' && k <= '4') {
      var i = +k - 1;
      if (i < c.perm.length) { e.preventDefault(); pick(i); }
    } else if (k === '0') {
      e.preventDefault();
      dunno();
    } else if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      var ready = sess.mode === 'exam' ? c.picked != null : !!c.res;
      if (ready) { e.preventDefault(); next(); }
    }
  });

  render();
})();
</script>
</body>
</html>
