<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Тренажёр по блоку III</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f5f4ef;
  --surface: #ffffff;
  --surface-2: #eeede6;
  --text: #1c1e21;
  --muted: #5b6066;
  --faint: #868b91;
  --line: #dddbd2;
  --accent: #1d6b58;
  --accent-hover: #175747;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --accent-line: #a9d0c2;
  --ok: #1d7448;
  --ok-soft: #e3f3e9;
  --ok-line: #8fcaa7;
  --bad: #ad3f2c;
  --bad-soft: #fbeae6;
  --bad-line: #e7a597;
  --warn: #855800;
  --warn-soft: #fbf1d9;
  --seg1: #d98b73;
  --seg2: #e0b354;
  --seg3: #1d6b58;
  --mark: #fde68a;
  --focus: #2563eb;
  --shadow: 0 1px 2px rgba(30, 30, 10, .05), 0 4px 14px rgba(30, 30, 10, .05);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1a1d20; --surface-2: #25292d; --text: #e9e7e2; --muted: #a9aeb3; --faint: #80868c; --line: #31363b;
    --accent: #5fc4a6; --accent-hover: #78d1b6; --accent-ink: #0a1c16; --accent-soft: #1a312a; --accent-line: #2f5f51;
    --ok: #77d4a0; --ok-soft: #17301f; --ok-line: #2f6b47; --bad: #f29a86; --bad-soft: #36201b; --bad-line: #7a3c30;
    --warn: #e8bb55; --warn-soft: #33290f; --seg1: #c9775f; --seg2: #c99a3e; --seg3: #5fc4a6; --mark: #6b5a12; --focus: #7aa7ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1a1d20; --surface-2: #25292d; --text: #e9e7e2; --muted: #a9aeb3; --faint: #80868c; --line: #31363b;
  --accent: #5fc4a6; --accent-hover: #78d1b6; --accent-ink: #0a1c16; --accent-soft: #1a312a; --accent-line: #2f5f51;
  --ok: #77d4a0; --ok-soft: #17301f; --ok-line: #2f6b47; --bad: #f29a86; --bad-soft: #36201b; --bad-line: #7a3c30;
  --warn: #e8bb55; --warn-soft: #33290f; --seg1: #c9775f; --seg2: #c99a3e; --seg3: #5fc4a6; --mark: #6b5a12; --focus: #7aa7ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { line-height: 1.25; }
/* боковые отступы не меньше 16px и не залезают под «чёлку» в альбомной ориентации */
.app { max-width: 640px; margin: 0 auto; padding-block: 0 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-wrap: break-word; }
.app.has-dock { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.i { display: inline-flex; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* шапка */
.top { display: flex; align-items: center; gap: 12px; padding: 16px 0 6px; }
.top .grow { flex: 1; min-width: 0; }
.top h1 { font-size: 19px; margin: 0; }
.top .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
.icon-btn { flex: none; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--muted); }
.icon-btn:hover { border-color: var(--accent-line); }

/* липкая панель в режимах */
.bar, .searchbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-title { flex: 1; min-width: 0; }
.bar-title .t { display: block; font-weight: 650; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-title .count { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.chips-r { display: flex; gap: 6px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 650; }
.progress { height: 4px; margin-top: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* вопрос */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 14px; box-shadow: var(--shadow); }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.tag { padding: 2px 8px; border-radius: 6px; background: var(--surface-2); font-weight: 650; font-size: 12px; color: var(--muted); }
.tag.rep { background: var(--warn-soft); color: var(--warn); }
.tag.b1 { background: var(--bad-soft); color: var(--bad); }
.tag.b2 { background: var(--warn-soft); color: var(--warn); }
.tag.b3 { background: var(--ok-soft); color: var(--ok); }
.qtext { font-size: 17px; line-height: 1.5; margin: 0; hyphens: auto; -webkit-hyphens: auto; }
.qtext .tail { color: var(--faint); }
.neg { font-weight: 700; background: var(--warn-soft); border-radius: 4px; padding: 0 2px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { position: relative; display: block; width: 100%; text-align: left; padding: 14px 14px 14px 54px; min-height: 58px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.45; font-size: 16px; hyphens: auto; -webkit-hyphens: auto; transition: background-color .15s, border-color .15s, opacity .15s; }
.opt .n { position: absolute; left: 12px; top: 13px; width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background-color .15s, color .15s; }
@media (hover: hover) { .opt:not([aria-disabled="true"]):hover { border-color: var(--accent-line); } }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .n { background: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--ok-line); background: var(--ok-soft); }
.opt.ok .n { background: var(--ok); color: var(--surface); }
.opt.bad { border-color: var(--bad-line); background: var(--bad-soft); }
.opt.bad .n { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .55; }
.opt[aria-disabled="true"] { cursor: default; }

/* разбор ответа */
.fb { margin-top: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; animation: rise .2s ease-out; }
.fb-head { display: flex; align-items: flex-start; gap: 10px; }
.status { flex: none; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; margin-top: 1px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.status.skip { background: var(--surface-2); color: var(--muted); }
.fb-msg { margin: 0; font-size: 15px; }
.sec { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.sec h3 { margin: 0 0 3px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sec p { margin: 0; font-size: 15px; }
.sec.trap h3 { color: var(--warn); }
.sec.hook h3, .sec.right h3 { color: var(--ok); }
.fb-box { margin: 12px 0 0; font-size: 13px; color: var(--faint); }
.kbd-hint { display: none; text-align: center; color: var(--faint); font-size: 12px; margin: 14px 0 0; }
@media (hover: hover) and (pointer: fine) { .kbd-hint { display: block; } }

/* нижняя панель действий */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock-in { max-width: 608px; margin: 0 auto; display: flex; gap: 10px; }

/* кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 12px 18px; border-radius: 12px; border: 1.5px solid transparent; font-weight: 650; font-size: 16px; cursor: pointer; text-align: center; line-height: 1.25; transition: background-color .15s, border-color .15s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--accent-line); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-danger { background: var(--surface); border-color: var(--bad-line); color: var(--bad); }
.btn-danger-solid { background: var(--bad); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.btn[aria-disabled="true"] { opacity: .45; cursor: default; }

/* главная */
.banner { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px 10px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.banner p { margin: 0; flex: 1; min-width: 0; }
.banner .x { flex: none; min-width: 40px; min-height: 40px; border: 0; background: transparent; color: var(--faint); cursor: pointer; border-radius: 10px; font-size: 20px; line-height: 1; }
.next { margin-top: 10px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 18px; padding: 16px 16px 14px; }
.eyebrow { font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
.next .say { margin: 6px 0 14px; font-size: 17px; line-height: 1.45; }
.next .btn + .btn { margin-top: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
.card h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 650; }
.big { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 10px; }
.big b { font-size: 30px; font-weight: 750; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); }
.meter { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.meter > i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.trow { margin-top: 12px; }
.trow .lab { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 4px; }
.trow .lab span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trow .meter { height: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.sect-h { margin: 22px 2px 4px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.modes { display: grid; gap: 8px; margin-top: 8px; }
.mode { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 12px 12px 12px; min-height: 66px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; transition: border-color .15s; }
.mode:hover { border-color: var(--accent-line); }
.mode .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.mode .t { display: block; font-weight: 650; font-size: 16px; }
.mode .d { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; }
.mode .badge { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.foot { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; }
.foot p { margin: 10px 0 0; }

/* итоги */
.hero { padding: 18px 0 2px; }
.hero h2 { margin: 0; font-size: 22px; }
.score { font-size: 42px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 10px; }
.score-sub { color: var(--muted); margin: 2px 0 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 15px; }
.kv span:nth-child(even) { font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: grid; gap: 10px; margin-top: 16px; }
.note-calm { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 15px; }

/* карточки шпаргалки и разбора */
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
.entry .qtext { font-size: 15.5px; }
.ans { margin-top: 10px; padding: 9px 12px; border-radius: 10px; font-size: 15px; display: flex; gap: 8px; }
.ans::before { flex: none; font-weight: 800; }
.ans.right { background: var(--ok-soft); border: 1px solid var(--ok-line); }
.ans.right::before { content: "✓"; color: var(--ok); }
.ans.wrong { background: var(--bad-soft); border: 1px solid var(--bad-line); }
.ans.wrong::before { content: "✗"; color: var(--bad); }
.ans.none { background: var(--surface-2); color: var(--muted); }
.ans.none::before { content: "—"; }
.ans small { display: block; font-size: 12px; color: var(--muted); font-weight: 650; }
.notes { margin-top: 8px; font-size: 14.5px; color: var(--muted); }
.notes p { margin: 6px 0 0; }
.notes b { color: var(--text); font-weight: 650; }
.notes .tr b { color: var(--warn); }

/* поиск */
.field { position: relative; margin-top: 8px; }
.field .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.field input { width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px 44px 10px 42px; font-size: 16px; -webkit-appearance: none; appearance: none; }
.field input:focus { outline: none; border-color: var(--accent); }
.field .clr { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-width: 40px; min-height: 40px; border: 0; background: transparent; color: var(--faint); cursor: pointer; border-radius: 10px; font-size: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.filters button { min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.found { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* таблица цифр */
.ngroup h3 { margin: 22px 2px 6px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.nlist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.nrow + .nrow { border-top: 1px solid var(--line); }
.nrow > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, max-content); gap: 12px; align-items: baseline; padding: 11px 14px; }
.nrow > summary::-webkit-details-marker { display: none; }
.nrow .g { font-size: 15px; }
.nrow .f { font-weight: 750; text-align: right; font-size: 15px; max-width: 46vw; }
.nrow[open] > summary { background: var(--surface-2); }
.nrow .more { padding: 4px 14px 14px; background: var(--surface-2); font-size: 14.5px; }
.nrow .more .qtext { font-size: 14.5px; }

/* тосты и диалоги */
.toasts { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 560px; width: 100%; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-size: 15px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); animation: rise .2s ease-out; transition: opacity .2s; }
.toast.out { opacity: 0; }
.overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, .45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 560px) { .overlay { align-items: center; } }
.dialog { background: var(--surface); color: var(--text); border-radius: 18px; padding: 20px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
.dialog h2 { margin: 0 0 8px; font-size: 19px; }
.dialog p { margin: 0 0 18px; color: var(--muted); }
.dialog .row { display: flex; gap: 10px; }
.dialog .row .btn { flex: 1; }

@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script type="application/json" id="data-expl">{"1":{"why":"К работам по эксплуатации допускают работников, прошедших обучение безопасным методам и приёмам выполнения работ и стажировку на рабочем месте (п. 9 Правил по охране труда, 924н).","trap":null,"hook":null},"2":{"why":"Повторный инструктаж для работ с повышенными требованиями охраны труда — не реже раза в 3 месяца (п. 9 Правил по охране труда, 924н).","trap":"Не путай с проверкой знаний: та — раз в 12 месяцев, а повторный инструктаж — раз в 3 месяца.","see":[3],"hook":"Инструктаж — раз в квартал.","gist":"Повторный инструктаж (повышенные требования ОТ)","figure":"не реже раза в 3 месяца"},"3":{"why":"Проверка знаний требований охраны труда для работ с повышенными требованиями — не реже раза в 12 месяцев (п. 9 Правил по охране труда, 924н).","trap":"Не путай с повторным инструктажем: тот — раз в 3 месяца, а проверка знаний — раз в 12 месяцев.","see":[2],"hook":"Проверка знаний — раз в год, инструктаж — раз в квартал.","gist":"Проверка знаний (повышенные требования ОТ)","figure":"не реже раза в 12 месяцев"},"4":{"why":"К техобслуживанию и ремонту допускают работников с профессиональной подготовкой, соответствующей характеру работ, включая подготовку по охране труда (п. 11 Правил по охране труда, 924н).","trap":null,"hook":null},"5":{"why":"Если арматура и другие элементы находятся выше 1,8 м от пола, для их обслуживания нужны металлические площадки с лестницей и перилами высотой не менее 1,1 м (п. 20 Правил по охране труда, 924н).","trap":"Не путай: 0,8 и 0,6 м — это ширина площадок и лестниц, а перила — не менее 1,1 м.","see":[6,8],"hook":null,"gist":"Высота перил площадок (элементы выше 1,8 м)","figure":"не менее 1,1 м"},"6":{"why":"Площадки для обслуживания арматуры и приборов — шириной не меньше 0,8 м (п. 20 Правил по охране труда, 924н).","trap":"Не путай с лестницами: у них 0,6 м, а у площадок — 0,8 м.","see":[8],"hook":"Площадка пошире лестницы: 0,8 против 0,6.","gist":"Ширина площадок к арматуре и приборам","figure":"не менее 0,8 м"},"7":{"why":"Площадки и ступени лестниц — гладкие или из прутковой (круглой) стали — запрещены в любом случае (п. 20 Правил по охране труда, 924н).","trap":null,"hook":null},"8":{"why":"Лестницы для обслуживания арматуры и приборов — шириной не меньше 0,6 м (п. 20 Правил по охране труда, 924н).","trap":"Не путай с площадками: у них 0,8 м, а у лестниц — 0,6 м.","see":[6],"hook":"Лестница поуже площадки: 0,6 против 0,8.","gist":"Ширина лестниц к арматуре и приборам","figure":"не менее 0,6 м"},"9":{"why":"Лестницы высотой больше 1,5 м для систематического обслуживания оборудования должны иметь наклон к горизонтали не больше 50° (п. 20 Правил по охране труда, 924н).","trap":"Не 1,4 м и 60°, а 1,5 м и 50° — варианты отличаются только цифрами.","hook":"Обе цифры с пятёркой: 1,5 м и 50°.","gist":"Наклон лестниц для систематического обслуживания","figure":"выше 1,5 м — наклон не более 50°"},"10":{"why":"В местах проходов от пола до низа площадок обслуживания и коммуникаций должно быть не меньше 2 м (п. 22 Правил по охране труда, 924н).","trap":"Не путай: 1,8 м и 1,1 м — цифры про площадки и перила, а высота прохода под ними — не менее 2 м.","see":[5],"hook":"2 м — как высота обычной двери.","gist":"Высота прохода под площадками и коммуникациями","figure":"не менее 2 м"},"11":{"why":"Работы повышенной опасности при техобслуживании и ремонте выполняют по наряду-допуску (п. 23 Правил по охране труда, 924н).","trap":null,"hook":null},"12":{"why":"Перечень работ по нарядам-допускам утверждает и может дополнять работодатель (п. 26 Правил по охране труда, 924н).","trap":null,"hook":null},"13":{"why":"Если подрядная или сервисная организация работает на территории организации, на весь период работ оформляют акт-допуск (п. 27 Правил по охране труда, 924н).","trap":null,"hook":null},"14":{"why":"Без разрешения главного инженера теплообменники и трубопроводы можно отключить одной задвижкой, если температура воды в действующем оборудовании не выше 45°С (п. 31 Правил по охране труда, 924н).","trap":"В цифре: не 50, 55 или 60°С, а 45°С.","hook":"45°С — та же цифра, что и для поверхности теплоизоляции.","gist":"Одна задвижка без разрешения главного инженера","figure":"вода не выше 45°С"},"15":{"why":"Неверно как раз утверждение, что запорная арматура дренажей закрытого типа после дренирования должна быть открыта (п. 32 Правил по охране труда, 924н).","trap":"Всё решает тип дренажа: про открытые дренажи утверждение верное, а про дренажи закрытого типа — нет.","hook":null},"16":{"why":"В помещениях с повышенной опасностью и особо опасных можно использовать переносные светильники напряжением не выше 50 В (п. 36 Правил по охране труда, 924н).","trap":"Не путай с работой в ёмкостях и колодцах: там не выше 12 В, а здесь — не выше 50 В.","see":[17],"hook":"Помещение — 50 В, ёмкость или колодец — 12 В.","gist":"Переносные светильники в опасных помещениях","figure":"не выше 50 В"},"17":{"why":"В особо неблагоприятных условиях (металлические ёмкости и резервуары, газоходы, барабаны котлов, колодцы) переносные светильники — не выше 12 В (п. 36 Правил по охране труда, 924н).","trap":"Не путай с опасными помещениями: там 50 В, а в ёмкостях и колодцах — не выше 12 В.","see":[16],"hook":"12 В — как у автомобильного аккумулятора.","gist":"Переносные светильники в ёмкостях и колодцах","figure":"не выше 12 В"},"18":{"why":"Тепловая изоляция должна обеспечивать температуру наружной поверхности не выше +45°С (п. 39 Правил по охране труда, 924н).","trap":"В цифре: не +50, +55 или +60°С, а +45°С.","hook":"Та же 45°С, что и для отключения одной задвижкой без разрешения.","gist":"Температура поверхности тепловой изоляции","figure":"не выше +45°С"},"19":{"why":"Эксплуатировать можно, если на манометре есть пломба или клеймо с отметкой о поверке (п. 44 Правил по охране труда, 924н).","trap":null,"hook":null},"20":{"why":"При газоопасных работах используют светильники во взрывозащищённом исполнении напряжением не выше 12 В (п. 45 Правил по охране труда, 924н).","trap":"Не путай с опасными помещениями (там 50 В): при газоопасных работах — не выше 12 В.","see":[16],"hook":"Та же 12 В, что и в ёмкостях и колодцах.","gist":"Взрывозащищённые светильники при газоопасных работах","figure":"не выше 12 В"},"21":{"why":"Лишнее здесь — требования к безопасной эксплуатации котельных или котлов в едином техпроцессе только для производственных целей: их ПТЭ не устанавливают (п. 2 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «только для производственных целей».","hook":null},"22":{"why":"Вопрос на исключение: Правила не обязательны как раз для варианта «теплопотребляющие установки, включая установки единого техпроцесса на промышленных предприятиях» (п. 2 ПТЭ, приказ № 511).","trap":"Не путай с парным вопросом без «не»: там ответ — источники комбинированной выработки без подключения к ЕЭС.","see":[23],"hook":null},"23":{"why":"Из перечисленного Правила обязательны для источников комбинированной выработки электрической и тепловой энергии без подключения к ЕЭС России или изолированным энергосистемам (п. 2 ПТЭ, приказ № 511).","trap":"Не путай с парным вопросом с «не»: там ответ — теплопотребляющие установки, включая установки единого техпроцесса.","see":[22],"hook":null},"24":{"why":"Для источников комбинированной выработки электрической и тепловой энергии Правила не обязательны в части эксплуатации баков-аккумуляторов холодной воды (п. 2 ПТЭ, приказ № 511).","trap":null,"hook":null},"25":{"why":"Лишнее здесь — ликвидация: это та функция, которую эксплуатирующая организация реализовать не должна (п. 5 ПТЭ, приказ № 511).","trap":"Не путай: консервация в число функций входит, а ликвидация — нет.","hook":null},"26":{"why":"За разработку и утверждение положения о метрологическом обеспечении отвечает руководитель эксплуатирующей организации (п. 6 ПТЭ, приказ № 511).","trap":"Не путай: записи в техдокументацию обеспечивает ответственный, а положение о метрологии — руководитель.","see":[28],"hook":null},"27":{"why":"Вопрос на исключение: «контроль состояния объектов, за исключением их осмотра» ответственный не обеспечивает — это и есть лишний пункт (п. 7 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «за исключением их осмотра».","hook":null},"28":{"why":"За записи в техдокументацию о диагностировании, испытаниях, ремонтах, модернизации и реконструкции отвечает ответственный за исправное состояние и безопасную эксплуатацию (п. 7 ПТЭ, приказ № 511).","trap":"Не путай: положение о метрологическом обеспечении — забота руководителя, а записи в документацию — ответственного.","see":[26],"hook":null},"29":{"why":"Лишнее здесь — проверка проведения противоаварийных тренировок: в порядке обходов и осмотров рабочих мест такого положения быть не должно (п. 9 ПТЭ, приказ № 511).","trap":null,"hook":null},"30":{"why":"Результаты обхода и осмотра вносят в оперативный журнал в течение 1 рабочего дня со дня их завершения (п. 10 ПТЭ, приказ № 511).","trap":"Не «сразу» и не 3 рабочих дня, а в течение 1 рабочего дня.","hook":"Как и сведения о ТО и текущем ремонте — 1 рабочий день.","gist":"Срок записи обхода и осмотра в журнал","figure":"в течение 1 рабочего дня"},"31":{"why":"Наличие и скорость наружной и внутренней коррозии котлов, трубопроводов тепловой сети и другого оборудования контролирует эксплуатирующая организация (п. 11 ПТЭ, приказ № 511).","trap":null,"hook":null},"32":{"why":"Типовой (минимальный) объём работ по техобслуживанию и текущему ремонту в технологических картах устанавливает технический руководитель эксплуатирующей организации (п. 12 ПТЭ, приказ № 511).","trap":"Обрати внимание: не просто «руководитель», а «технический руководитель».","hook":null},"33":{"why":"Лишнее здесь — оперативный журнал результатов обхода и осмотра: при разработке технологических карт его не используют (п. 12 ПТЭ, приказ № 511).","trap":null,"hook":null},"34":{"why":"Сведения о техобслуживании, текущем ремонте и их результатах вносят в журнал в течение 1 рабочего дня со дня завершения ремонта (п. 13 ПТЭ, приказ № 511).","trap":"Не «непосредственно после» и не 3 дня, а в течение 1 рабочего дня.","hook":"Как и записи об обходах и осмотрах — 1 рабочий день.","gist":"Срок записи о ТО и текущем ремонте","figure":"в течение 1 рабочего дня"},"35":{"why":"Объём работ при среднем и капитальном ремонте устанавливает технический руководитель эксплуатирующей организации (п. 13 ПТЭ, приказ № 511).","trap":"Всё решает слово «техническим»: не просто руководитель, а технический руководитель.","hook":null},"36":{"why":"После текущего ремонта объекты принимает ответственный за исправное состояние и безопасную эксплуатацию (п. 14 ПТЭ, приказ № 511).","trap":"Не путай с капитальным ремонтом: там принимает комиссия, назначенная техническим руководителем.","see":[37],"hook":null},"37":{"why":"Комиссия, которую назначает технический руководитель, принимает объекты после капитального ремонта (п. 14 ПТЭ, приказ № 511).","trap":"Не путай с текущим ремонтом: после него принимает ответственный за исправное состояние, а не комиссия.","see":[36],"hook":null},"38":{"why":"Лишнее здесь — порядок организации и проведения ремонта: к актам приёмки после ремонта его не прилагают (п. 15 ПТЭ, приказ № 511).","trap":null,"hook":null},"39":{"why":"Порядок технического освидетельствования оборудования под избыточным давлением определяют сами ПТЭ (п. 16 ПТЭ, приказ № 511).","trap":null,"hook":null},"40":{"why":"Лишнее здесь — контроль исправности и наличия на рабочих местах предохранительных приспособлений и средств защиты: в техническое освидетельствование он не входит (п. 17 ПТЭ, приказ № 511).","trap":null,"hook":null},"41":{"why":"Неверная цель наружного и внутреннего осмотра здесь — выявление отсутствия или неисправности элементов защит (п. 18 ПТЭ, приказ № 511).","trap":null,"hook":null},"42":{"why":"Трещины, надрывы, деформации и дефекты поверхности выявляют наружным и внутренним осмотром оборудования, работающего под избыточным давлением (п. 18 ПТЭ, приказ № 511).","trap":"Обрати внимание: не «техническое освидетельствование», а именно «наружный и внутренний осмотр».","hook":null},"43":{"why":"По требованию ответственного футеровку, обмуровку и изоляцию удаляют, если по признакам под ними могут быть дефекты, влияющие на безопасность (п. 19 ПТЭ, приказ № 511).","trap":null,"hook":null},"44":{"why":"Гидроиспытание на прочность и плотность проводят, чтобы выявить дефекты оборудования и его элементов и проверить плотность их соединений (п. 20 ПТЭ, приказ № 511).","trap":"Не путай с осмотром: трещины, надрывы и деформации выявляют наружным и внутренним осмотром.","see":[42],"hook":null},"45":{"why":"Манометры для контроля давления при гидроиспытании должны иметь одинаковый предел измерения и одинаковую цену деления (п. 20 ПТЭ, приказ № 511).","trap":"Вариант «не менее чем тремя манометрами» неверный: в парном вопросе он и есть ответ.","see":[46],"hook":null},"46":{"why":"Неверно как раз утверждение, что давление воды при гидроиспытании контролируют не менее чем тремя манометрами (п. 20 ПТЭ, приказ № 511).","trap":null,"hook":null},"47":{"why":"Оборудование повторно испытывают пробным давлением, если при гидроиспытании на прочность и плотность нашли дефекты, из-за которых не удалось обеспечить нужное время выдержки (п. 22 ПТЭ, приказ № 511).","trap":null,"hook":null},"48":{"why":"Сначала устраняют выявленные дефекты, а затем оборудование и его элементы снова проходят гидравлические испытания пробным давлением (п. 22 ПТЭ, приказ № 511).","trap":null,"hook":null},"49":{"why":"Работу оборудования под избыточным давлением продолжать нельзя, если установлено, что из-за дефектов или нарушений оно в опасном для дальнейшей эксплуатации состоянии (п. 23 ПТЭ, приказ № 511).","trap":"Не путай с повторным гидроиспытанием: оно нужно, если дефекты не дали обеспечить выдержку при пробном давлении.","see":[47],"hook":null},"50":{"why":"Решение о выводе из эксплуатации принимают, если трещины или иные эксплуатационные дефекты в металле и соединениях больше значений из проекта и (или) документации изготовителя (п. 24 ПТЭ, приказ № 511).","trap":null,"hook":null},"51":{"why":"Не показание к выводу из эксплуатации — повреждения опорных металлоконструкций (каркаса), в том числе трещины и деформации, если они не влияют на несущую способность (п. 24 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «не влияющих на их несущую способность».","hook":null},"52":{"why":"Срок службы оборудования, отработавшего установленный срок, по итогам технического диагностирования продлевает технический руководитель эксплуатирующей организации (п. 27 ПТЭ, приказ № 511).","trap":"Ответственный за исправное состояние принимает объекты из текущего ремонта, а срок службы продлевает технический руководитель.","see":[36],"hook":null},"53":{"why":"Если срок службы не указан в документации изготовителя или в проекте, технический руководитель устанавливает его по срокам службы аналогичного (подобного) оборудования (п. 27 ПТЭ, приказ № 511).","trap":null,"hook":null},"54":{"why":"Оборудование предохраняют от коррозии, механических и других воздействий, если перерыв в его использовании — не меньше шести месяцев подряд (п. 29 ПТЭ, приказ № 511).","trap":"В сроке: не девять и не двенадцать, а шесть месяцев подряд.","hook":null},"55":{"why":"При хранении оборудование нужно предохранять от коррозии, механических и других воздействий (п. 29 ПТЭ, приказ № 511).","trap":null,"hook":null},"56":{"why":"Персонал делят на категории, чтобы организовать и проводить работу с персоналом (п. 52 ПТЭ, приказ № 511).","trap":null,"hook":null},"57":{"why":"К какой категории персонала относится работник, определяют должностные инструкции (п. 53 ПТЭ, приказ № 511).","trap":"Сами Правила — ответ про порядок технического освидетельствования, а категорию работника определяют должностные инструкции.","see":[39],"hook":null},"58":{"why":"Обучение по охране труда и проверка знания её требований обязательны для всех категорий персонала (п. 54 ПТЭ, приказ № 511).","trap":"Не путай со стажировкой: её не устанавливают для руководителей и специалистов, а обучение по охране труда — для всех.","see":[59],"hook":null},"59":{"why":"Стажировку как обязательную форму работы не устанавливают для руководящих работников, руководителей подразделений, управленческого персонала и специалистов (п. 54 ПТЭ, приказ № 511).","trap":null,"hook":null},"60":{"why":"Длительность стажировки задают индивидуально — по уровню профессионального образования, опыту работы и профессии (должности) обучаемого (п. 55 ПТЭ, приказ № 511).","trap":"Обрати внимание: в похожем варианте вместо образования стоят «пожелания обучаемого».","hook":null},"61":{"why":"Лишнее здесь — возраст: при определении длительности стажировки его не учитывают (п. 55 ПТЭ, приказ № 511).","trap":null,"hook":null},"62":{"why":"Руководитель может освободить от стажировки, если стаж по специальности не меньше 3 лет, а при переходе на другое место характер работы и тип оборудования не меняются (п. 56 ПТЭ, приказ № 511).","trap":"Не 2 года с наставником, а стаж не менее 3 лет при том же характере работы и типе оборудования.","hook":null,"gist":"Освобождение от стажировки при переходе","figure":"стаж не менее 3 лет, работа и тип оборудования те же"},"63":{"why":"На стажёра не возлагают выполнение функциональных обязанностей под наблюдением ответственного за его подготовку — это и есть лишний пункт (п. 57 ПТЭ, приказ № 511).","trap":null,"hook":null},"64":{"why":"Проверка знаний бывает первичная, очередная и внеочередная (п. 58 ПТЭ, приказ № 511).","trap":"В одном слове: не «повторная», а «очередная».","hook":null},"65":{"why":"Первичную проверку знаний не проводят, если перерыв в проверке знаний был меньше 3 лет (п. 59 ПТЭ, приказ № 511).","trap":"Обрати внимание: не «более», а «менее 3 лет».","hook":null,"gist":"Когда первичную проверку знаний не проводят","figure":"перерыв в проверке менее 3 лет"},"66":{"why":"Оперативные руководители, оперативный, диспетчерский, оперативно-ремонтный и ремонтный персонал, работающие непосредственно с оборудованием, проходят очередную проверку не реже 1 раза в год (п. 60 ПТЭ, приказ № 511).","trap":"Не путай с руководством, не участвующим в эксплуатации: у них раз в 5 лет, а здесь — раз в год.","see":[67],"hook":"Кто эксплуатирует сам — каждый год, кто руководит со стороны — раз в пятилетку.","gist":"Очередная проверка: персонал у оборудования","figure":"не реже 1 раза в год"},"67":{"why":"Руководители организации и подразделений и управленческий персонал, не участвующие непосредственно в эксплуатации оборудования, проходят очередную проверку не реже 1 раза в 5 лет (п. 60 ПТЭ, приказ № 511).","trap":"Варианты отличаются только цифрой: не 7 и не 10 лет, а 5.","hook":"Пятилетка — для тех, кто руководит со стороны; кто у оборудования — каждый год.","gist":"Очередная проверка: руководство без участия в эксплуатации","figure":"не реже 1 раза в 5 лет"},"68":{"why":"Противоречит Правилам как раз условие о перерыве в работе на должности (рабочем месте) более 3 месяцев (п. 64 ПТЭ, приказ № 511).","trap":null,"hook":null,"gist":"Внеочередная проверка: неверное условие","figure":"перерыв в работе более 3 месяцев"},"69":{"why":"Внеочередную проверку проводят, если так решил руководитель организации при введении в действие нормативных правовых актов, знание которых обязательно для работника (п. 64 ПТЭ, приказ № 511).","trap":null,"hook":null},"70":{"why":"Если в организации не хватает людей, чтобы образовать комиссию, проверку знаний проводят в комиссии органов федерального государственного энергетического надзора (п. 69 ПТЭ, приказ № 511).","trap":null,"hook":null},"71":{"why":"Тому, кто получил неудовлетворительную оценку, пересдачу назначают не позднее 1 месяца со дня предыдущей проверки (п. 72 ПТЭ, приказ № 511).","trap":"Не 1 неделя и не 6 недель, а не позднее 1 месяца.","hook":null,"gist":"Пересдача после неудовлетворительной оценки","figure":"не позднее 1 месяца"},"72":{"why":"Лишнее здесь — дата рождения проверяемого: её журнал проверки знаний содержать не должен (п. 73 ПТЭ, приказ № 511).","trap":null,"hook":null},"73":{"why":"Дублирование можно не проводить, если перерыв в работе был меньше 6 месяцев (п. 78 ПТЭ, приказ № 511).","trap":"Обрати внимание: не «более», а «менее 6 месяцев».","hook":null,"gist":"Когда можно без дублирования","figure":"перерыв в работе менее 6 месяцев"},"74":{"why":"При подготовке по новой должности дублирование длится не меньше 12 рабочих смен (п. 81 ПТЭ, приказ № 511).","trap":"Не 10 и не 2 смены, а не менее 12 — при подготовке по новой должности.","hook":"Новая должность — дюжина смен.","gist":"Дублирование по новой должности","figure":"не менее 12 рабочих смен"},"75":{"why":"В объём специальной подготовки не входит разбор случившихся в организации допустимых отклонений параметров технологических процессов и работы оборудования (п. 87 ПТЭ, приказ № 511).","trap":"Не путай с программой планового инструктажа: ознакомление с впервые применёнными технологиями лишнее там, а не здесь.","see":[80],"hook":null},"76":{"why":"Производственный инструктаж бывает плановый и внеплановый (п. 88 ПТЭ, приказ № 511).","trap":"Не путай с проверкой знаний: она первичная, очередная и внеочередная, а инструктаж — плановый и внеплановый.","see":[64],"hook":null},"77":{"why":"Плановые производственные инструктажи проводят ежемесячно (п. 89 ПТЭ, приказ № 511).","trap":"Не путай с противоаварийной тренировкой: она — не менее 1 раза в 3 месяца, а плановый инструктаж — ежемесячно.","see":[83],"hook":null},"78":{"why":"В производственный инструктаж не включают вопросы трудового законодательства РФ — это лишний пункт (п. 89 ПТЭ, приказ № 511).","trap":null,"hook":null},"79":{"why":"Программу планового производственного инструктажа разрабатывают (актуализируют) ежегодно (п. 90 ПТЭ, приказ № 511).","trap":"Не путай: сам плановый инструктаж — ежемесячно, а его программу актуализируют ежегодно.","see":[77],"hook":null},"80":{"why":"Лишнее здесь — ознакомление со спецификой впервые применённых технологий эксплуатации нового оборудования: в программу планового инструктажа его не включают (п. 90 ПТЭ, приказ № 511).","trap":null,"hook":null},"81":{"why":"Производственный инструктаж можно проводить сразу с группой, если работники эксплуатируют однотипное оборудование (п. 92 ПТЭ, приказ № 511).","trap":null,"hook":null},"82":{"why":"Как усвоен материал производственного инструктажа, проверяют опросом инструктируемого (п. 92 ПТЭ, приказ № 511).","trap":null,"hook":null},"83":{"why":"Оперативный, диспетчерский, оперативно-ремонтный персонал и оперативных руководителей проверяют в противоаварийной тренировке не менее 1 раза в 3 месяца (п. 98 ПТЭ, приказ № 511).","trap":"Не раз в полгода и не ежемесячно (так проводят плановый инструктаж), а не менее 1 раза в 3 месяца.","see":[77],"hook":"Тренировка — раз в квартал.","gist":"Противоаварийная тренировка оперативного персонала","figure":"не менее 1 раза в 3 месяца"},"84":{"why":"Из мер после повторной неудовлетворительной оценки на тренировке неверно указана как раз повторная стажировка сроком не менее 2 смен (п. 99 ПТЭ, приказ № 511).","trap":null,"hook":null,"gist":"Неверная мера после повторной неудачи на тренировке","figure":"повторная стажировка не менее 2 смен"},"85":{"why":"Пробные пуски оборудования проводят до комплексного опробования объекта теплоснабжения и (или) теплопотребляющей установки (п. 104 ПТЭ, приказ № 511).","trap":null,"hook":null},"86":{"why":"Комплексное опробование источников тепловой энергии должно длиться не меньше 72 часов (п. 106 ПТЭ, приказ № 511).","trap":"Не путай: 24 часа — для теплопотребляющих установок и прочих объектов, а для источников — 72.","see":[87],"hook":"Источник — трое суток, остальные объекты — сутки.","gist":"Комплексное опробование источников тепловой энергии","figure":"не менее 72 часов"},"87":{"why":"Для теплопотребляющих установок и других объектов теплоснабжения, кроме источников тепловой энергии, комплексное опробование длится не меньше 24 часов (п. 106 ПТЭ, приказ № 511).","trap":"Не 8 и не 12 часов, а 24; 72 часа — это для источников тепловой энергии.","see":[86],"hook":"Сутки — для установок, трое суток — для источников.","gist":"Комплексное опробование установок и прочих объектов","figure":"не менее 24 часов"},"88":{"why":"Включать в работу объекты теплоснабжения и теплопотребляющие установки с отступлениями от технических условий на подключение нельзя ни в каком случае (п. 108 ПТЭ, приказ № 511).","trap":null,"hook":null},"89":{"why":"Неверная задача здесь — управление системой теплоснабжения как обособленными технологическими комплексами (п. 110 ПТЭ, приказ № 511).","trap":"Всё решает слово «обособленными».","hook":null},"90":{"why":"В нерасчётном режиме нужно определить меры реагирования по возможным сценариям, организовать их выполнение и перевести не задействованные на первом этапе силы и средства в повышенную готовность (п. 111 ПТЭ, приказ № 511).","trap":null,"hook":null},"91":{"why":"При суммарной расчётной нагрузке потребителей 10 Гкал/ч и более в зоне ЕТО создают круглосуточную диспетчерскую службу (п. 112 ПТЭ, приказ № 511).","trap":"«По решению руководителя ЕТО» — это при нагрузке менее 10 Гкал/ч, а при 10 Гкал/ч и более — круглосуточная служба.","see":[92],"hook":null},"92":{"why":"При суммарной расчётной нагрузке потребителей менее 10 Гкал/ч диспетчерское управление в зоне ЕТО организуют по решению руководителя ЕТО (п. 112 ПТЭ, приказ № 511).","trap":"Круглосуточная служба — при 10 Гкал/ч и более, а при меньшей нагрузке решает руководитель ЕТО.","see":[91],"hook":null},"93":{"why":"Неверно как раз то, что инструкции включают перечень переключений по согласованным заявкам «за исключением» тех, что переводят объекты из одного оперативного состояния в другое (п. 115 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «за исключением…» в конце варианта.","hook":null},"94":{"why":"Инструкцию по диспетчерскому управлению утверждает технический руководитель эксплуатирующей организации (п. 116 ПТЭ, приказ № 511).","trap":"Обрати внимание: не просто «руководитель», а «технический руководитель».","hook":null},"95":{"why":"Инструкции по диспетчерскому управлению актуализируют не реже чем раз в три года (п. 116 ПТЭ, приказ № 511).","trap":"В сроке: не четыре года и не пять лет, а три года.","hook":null},"96":{"why":"Среди категорий управления оборудованием для уровней диспетчерского управления лишняя — «оперативное сопровождение» (п. 117 ПТЭ, приказ № 511).","trap":null,"hook":null},"97":{"why":"Неверно как раз то, что подчинённый диспетчер обязан в любом случае выполнить распоряжение вышестоящего, которое кажется ему ошибочным (п. 120 ПТЭ, приказ № 511).","trap":null,"hook":null},"98":{"why":"Эксплуатирующие организации не разрабатывают как раз «общие» тепловые и гидравлические режимы на отопительный и межотопительный период (п. 125 ПТЭ, приказ № 511).","trap":"Всё решает слово «общие»: в остальных вариантах режимы на каждый период отдельно.","hook":null},"99":{"why":"Центральная диспетчерская служба задаёт температуру сетевой воды в подающих трубопроводах не по статическому давлению — этот фактор здесь лишний (п. 126 ПТЭ, приказ № 511).","trap":null,"hook":null},"100":{"why":"Температуру сетевой воды в подающих трубопроводах регулируют равномерно, со скоростью не больше 30 ºС в час (п. 126 ПТЭ, приказ № 511).","trap":"В цифре: не 40 и не 50, а 30 ºС в час.","hook":"30 ºС в час — это всего полградуса в минуту.","gist":"Скорость регулирования температуры сетевой воды","figure":"равномерно, не более 30 ºС в час"},"101":{"why":"Для источников допустимое отклонение температуры воды, поступающей в тепловую сеть, — три процента (п. 127 ПТЭ, приказ № 511).","trap":"Не путай с паром на коллекторах: там не более чем на 5%, а для воды в сеть — три процента.","see":[104],"hook":null},"102":{"why":"Среднесуточная температура сетевой воды в обратных трубопроводах может превышать температурный график не больше чем на 5% (п. 128 ПТЭ, приказ № 511).","trap":"Не путай со снижением: оно не регламентируется, а превышение — не более чем на 5% (не 10%).","see":[103],"hook":"Обратка сверх графика и пар — по 5%, а вода в сеть — три процента.","gist":"Превышение графика в обратных трубопроводах","figure":"не более чем на 5%"},"103":{"why":"Насколько среднесуточная температура в обратных трубопроводах может опускаться ниже температурного графика, не регламентируется (п. 128 ПТЭ, приказ № 511).","trap":"Не путай с превышением: выше графика — не более чем на 5%, а снижение не регламентируется.","see":[102],"hook":null},"104":{"why":"Давление и температура пара на коллекторах источника могут отклоняться от заданных не больше чем на 5%, если договор теплоснабжения не устанавливает иное (п. 128 ПТЭ, приказ № 511).","trap":"В цифре: не 10%, а 5%.","hook":"Пар и обратка сверх графика — по 5%, а вода в сеть — три процента.","gist":"Отклонение давления и температуры пара","figure":"не более чем на 5%"},"105":{"why":"Восстанавливать режим, в том числе циркуляцию, можно после того, как давление теплоносителя станет выше давления насыщения при текущей температуре с запасом 0,05 МПа (п. 134 ПТЭ, приказ № 511).","trap":"Обрати внимание: давление должно быть «выше» давления насыщения, а не «ниже».","hook":null,"gist":"Восстановление режима после падения давления","figure":"выше давления насыщения с запасом 0,05 МПа"},"106":{"why":"Без разрешения центральной диспетчерской службы объект можно вывести из работы при опасности для людей и оборудования — с последующим уведомлением диспетчерской службы (п. 143 ПТЭ, приказ № 511).","trap":null,"hook":null},"107":{"why":"К сложным не относятся переключения с участием одного подразделения или одной организации (п. 144 ПТЭ, приказ № 511).","trap":null,"hook":null},"108":{"why":"Ввод оборудования после монтажа и реконструкции относится к сложным пускам и переключениям (п. 144 ПТЭ, приказ № 511).","trap":null,"hook":null},"109":{"why":"Неверно как раз утверждение, что типовые программы переключений пересматривают не реже 1 раза в 5 лет (п. 146 ПТЭ, приказ № 511).","trap":null,"hook":null,"gist":"Пересмотр типовых программ переключений","figure":"неверно: «не реже 1 раза в 5 лет»"},"110":{"why":"Объём и методы обработки информации, поступающей в диспетчерскую службу из автоматизированных систем, определяет Положение о технической политике организации (п. 151 ПТЭ, приказ № 511).","trap":null,"hook":null},"111":{"why":"Требования к содержанию, обслуживанию, ремонту и опробованию средств автоматизированных систем задают инструкции по их эксплуатации, утверждённые техническим руководителем (п. 154 ПТЭ, приказ № 511).","trap":"Не путай с обработкой информации в диспетчерской: там Положение о технической политике, а здесь — инструкции по эксплуатации.","see":[110],"hook":null},"112":{"why":"Отключать технологическую защиту на работающих объектах можно с разрешения технического руководителя организации, оформив это в оперативном журнале (п. 155 ПТЭ, приказ № 511).","trap":"Не путай с выводом объектов из работы: там опасность и уведомление, а защиту отключают с разрешения технического руководителя.","see":[106],"hook":null},"113":{"why":"Неверно как раз то, что защиту допустимо выводить из работы в переходных режимах, где можно обойтись без её отключения (п. 156 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «возможна без отключения защит».","hook":null},"114":{"why":"Технический руководитель может взять руководство на себя, сообщив подчинённым и записав решение в оперативный журнал или дав устное распоряжение под запись оперативных переговоров (п. 162 ПТЭ, приказ № 511).","trap":"Взять руководство на себя можно, но не «без дополнительных условий» — нужно сообщить персоналу и зафиксировать решение.","hook":null},"115":{"why":"Осмотры, контрольные проверки и (или) мониторинг строительных конструкций не должен проводить технический руководитель организации (п. 166 ПТЭ, приказ № 511).","trap":null,"hook":null},"116":{"why":"Порядок осмотров, контрольных проверок и (или) мониторинга строительных конструкций определяет технический руководитель организации (п. 166 ПТЭ, приказ № 511).","trap":null,"hook":null},"117":{"why":"Порядок комплексных обследований технического состояния зданий и сооружений определяет руководитель эксплуатирующей организации (п. 167 ПТЭ, приказ № 511).","trap":"Не путай: акт по комплексному обследованию утверждает технический руководитель, а порядок обследований — руководитель.","see":[124],"hook":null},"118":{"why":"Когда истекли установленные проектной документацией сроки эксплуатации зданий и сооружений, проводят комплексное обследование их технического состояния (п. 167 ПТЭ, приказ № 511).","trap":null,"hook":null},"119":{"why":"Если при техническом обслуживании нашли дефекты, повреждения и деформации, угрожающие целостности зданий и сооружений, проводят комплексное обследование их технического состояния (п. 167 ПТЭ, приказ № 511).","trap":null,"hook":null},"120":{"why":"Если здание или сооружение пострадало от пожара, стихийного бедствия или аварии, проводят комплексное обследование его технического состояния (п. 167 ПТЭ, приказ № 511).","trap":null,"hook":null},"121":{"why":"Если меняется технологическое назначение зданий и сооружений, проводят комплексное обследование их технического состояния (п. 167 ПТЭ, приказ № 511).","trap":null,"hook":null},"122":{"why":"Перед капитальным ремонтом или реконструкцией зданий и сооружений проводят комплексное обследование их технического состояния (п. 167 ПТЭ, приказ № 511).","trap":null,"hook":null},"123":{"why":"Неверно как раз то, что комплексное обследование проводят при дефектах, повреждениях и деформациях, не угрожающих целостности зданий и сооружений (п. 167 ПТЭ, приказ № 511).","trap":"Всё решает частица «не»: комплексное обследование проводят при дефектах, угрожающих целостности.","see":[119],"hook":null},"124":{"why":"Акт по итогам комплексного обследования зданий и сооружений утверждает технический руководитель организации (п. 168 ПТЭ, приказ № 511).","trap":"Не путай: порядок комплексных обследований определяет руководитель, а акт по ним утверждает технический руководитель.","see":[117],"hook":null},"125":{"why":"Очередные осмотры зданий и сооружений проводят не реже 2 раз в год — весной и осенью (п. 169 ПТЭ, приказ № 511).","trap":"Обрати внимание на сезоны: не летом и зимой, а весной и осенью.","hook":"Весной — после таяния снега, осенью — перед отопительным периодом.","gist":"Очередные осмотры зданий и сооружений","figure":"не реже 2 раз в год — весной и осенью"},"126":{"why":"Очередной весенний осмотр зданий и сооружений проводят после таяния снега (п. 169 ПТЭ, приказ № 511).","trap":"Не путай с осенним: он не позднее чем за 15 дней до начала отопительного периода, а весенний — после таяния снега.","see":[127],"hook":null},"127":{"why":"Очередной осенний осмотр зданий и сооружений проводят не позднее чем за 15 дней до начала отопительного периода (п. 169 ПТЭ, приказ № 511).","trap":"Не путай с весенним: тот — после таяния снега, а осенний — не позднее чем за 15 дней до отопительного периода.","see":[126],"hook":"15 дней — это полмесяца в запасе до старта отопления.","gist":"Осенний осмотр зданий и сооружений","figure":"не позднее чем за 15 дней до отопительного периода"},"128":{"why":"Внеочередные осмотры зданий и сооружений проводят не позднее двух дней после стихийных явлений, стихийного бедствия или техногенной аварии (п. 169 ПТЭ, приказ № 511).","trap":"Не путай с очередными: «после таяния снега» — это весенний осмотр, «за 15 дней до отопительного периода» — осенний.","see":[126,127],"hook":null},"129":{"why":"Акт по итогам очередных и внеочередных осмотров зданий и сооружений утверждает технический руководитель организации (п. 169 ПТЭ, приказ № 511).","trap":"Обрати внимание: не просто «руководитель», а «технический руководитель».","hook":null},"130":{"why":"У источников мощностью 10 Гкал/ч и более со сроком эксплуатации менее 15 лет текущие осмотры зданий и сооружений — не реже 1 раза в 6 месяцев (п. 170 ПТЭ, приказ № 511).","trap":"Не путай с источниками менее 10 Гкал/ч моложе 10 лет: там раз в год, а здесь — раз в 6 месяцев.","see":[132],"hook":"Мощный и моложе 15 лет — раз в полгода; с возрастом — чаще.","gist":"Текущий осмотр: от 10 Гкал/ч, моложе 15 лет","figure":"не реже 1 раза в 6 месяцев"},"131":{"why":"У источников мощностью 10 Гкал/ч и более со сроком эксплуатации 15 лет и более текущие осмотры зданий и сооружений — не реже 1 раза в 4 месяца (п. 170 ПТЭ, приказ № 511).","trap":"Не путай со сроком менее 15 лет: там раз в 6 месяцев, а с 15 лет — раз в 4 месяца.","see":[130],"hook":"Старше — чаще: с 15 лет вместо полугода — раз в 4 месяца.","gist":"Текущий осмотр: от 10 Гкал/ч, 15 лет и старше","figure":"не реже 1 раза в 4 месяца"},"132":{"why":"У источников мощностью менее 10 Гкал/ч со сроком эксплуатации менее 10 лет текущие осмотры зданий и сооружений — не реже 1 раза в год (п. 170 ПТЭ, приказ № 511).","trap":"В сроке: не 2 года и не 18 месяцев, а раз в год.","hook":"Маленький и молодой — раз в год; с возрастом — чаще.","gist":"Текущий осмотр: менее 10 Гкал/ч, моложе 10 лет","figure":"не реже 1 раза в год"},"133":{"why":"У источников мощностью менее 10 Гкал/ч со сроком эксплуатации 10 лет и более текущие осмотры зданий и сооружений — не реже 1 раза в 6 месяцев (п. 170 ПТЭ, приказ № 511).","trap":"Не путай с источниками моложе 10 лет: там раз в год, а с 10 лет — раз в 6 месяцев.","see":[132],"hook":"Старше — чаще: с 10 лет вместо раза в год — раз в полгода.","gist":"Текущий осмотр: менее 10 Гкал/ч, 10 лет и старше","figure":"не реже 1 раза в 6 месяцев"},"134":{"why":"Текущие осмотры зданий и сооружений тепловых сетей со сроком эксплуатации менее 10 лет — не реже 1 раза в год (п. 170 ПТЭ, приказ № 511).","trap":"В сроке: не 18 месяцев и не 2 года, а раз в год.","hook":"Сроки как у источников менее 10 Гкал/ч: моложе 10 лет — раз в год.","gist":"Текущий осмотр тепловых сетей моложе 10 лет","figure":"не реже 1 раза в год"},"135":{"why":"Текущие осмотры зданий и сооружений тепловых сетей со сроком эксплуатации 10 лет и более — не реже 1 раза в 6 месяцев (п. 170 ПТЭ, приказ № 511).","trap":"Не путай с сетями моложе 10 лет: там раз в год, а с 10 лет — раз в 6 месяцев.","see":[134],"hook":"Сроки как у источников менее 10 Гкал/ч: с 10 лет — раз в полгода.","gist":"Текущий осмотр тепловых сетей 10 лет и старше","figure":"не реже 1 раза в 6 месяцев"},"136":{"why":"За конструкциями с трещинами, изломами и другими внешними признаками повреждений устанавливают наблюдение с маяками и инструментальными измерениями (п. 171 ПТЭ, приказ № 511).","trap":null,"hook":null},"137":{"why":"Хранить горючие материалы в цокольной части дымовых труб, под газоходами и рядом с ними нельзя ни в каком случае (п. 186 ПТЭ, приказ № 511).","trap":"Не путай с хранением материалов в неустановленных местах: там можно при ликвидации аварии, а здесь — никогда.","see":[149],"hook":null},"138":{"why":"Размещать под газоходами временные строения и сооружения нельзя ни в каком случае (п. 186 ПТЭ, приказ № 511).","trap":"Не путай с пробивкой отверстий и креплением к конструкциям: там можно при ликвидации аварии, а здесь — никогда.","see":[142,144],"hook":null},"139":{"why":"Внешний осмотр газоотводящего ствола, фундаментов, опорных конструкций, анкерных болтов, вантовых оттяжек с креплениями и металлических дымовых труб — не реже раза в 3 месяца (п. 193 ПТЭ, приказ № 511).","trap":"Варианты отличаются только сроком: не раз в месяц и не раз в 2 месяца, а раз в 3 месяца.","hook":"Тройка в обоих сроках: осмотр — раз в 3 месяца, приборы — раз в 3 года.","gist":"Внешний осмотр металлических дымовых труб","figure":"не реже раза в 3 месяца"},"140":{"why":"Есть ли конденсат и отложения сажи на внутренней поверхности металлических дымовых труб и газоходов, проверяют через люки не реже раза в год (п. 193 ПТЭ, приказ № 511).","trap":"Не путай с внешним осмотром трубы: он раз в 3 месяца, а конденсат и сажу проверяют раз в год.","see":[139],"hook":"По нарастающей: осмотр — раз в 3 месяца, сажа — раз в год, приборы — раз в 3 года.","gist":"Проверка конденсата и сажи в трубах","figure":"не реже 1 раза в год"},"141":{"why":"Инструментальное обследование металлических дымовых труб, наружное и внутреннее, — не реже раза в 3 года (п. 193 ПТЭ, приказ № 511).","trap":"Не путай с проверкой конденсата и сажи: она раз в год, а инструментальное обследование — раз в 3 года.","see":[140],"hook":"Тройка в обоих сроках: осмотр — раз в 3 месяца, приборы — раз в 3 года.","gist":"Инструментальное обследование металлических труб","figure":"не реже раза в 3 года"},"142":{"why":"Пробивать отверстия в несущих и ограждающих конструкциях можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"«Под контролем ответственного» есть и в неверном варианте — решает условие: ликвидация аварии, а не техрегламент.","hook":null},"143":{"why":"Устраивать проёмы в несущих и ограждающих конструкциях можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"«Под контролем ответственного» есть и в неверном варианте — решает условие: ликвидация аварии, а не техрегламент.","hook":null},"144":{"why":"Ставить, вешать и крепить технологическое оборудование к строительным конструкциям можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"«Под контролем ответственного» есть и в неверном варианте — решает условие: ликвидация аварии, а не техрегламент.","hook":null},"145":{"why":"Ставить, вешать и крепить трубопроводы к строительным конструкциям можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"«Под контролем ответственного» есть и в неверном варианте — решает условие: ликвидация аварии, а не техрегламент.","hook":null},"146":{"why":"Ставить, вешать и крепить к строительным конструкциям устройства для подъёма грузов можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"«Под контролем ответственного» есть и в неверном варианте — решает условие: ликвидация аварии, а не техрегламент.","hook":null},"147":{"why":"Вырезать связи каркаса помещений можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"«Под контролем ответственного» есть и в неверном варианте — решает условие: ликвидация аварии, а не техрегламент.","hook":null},"148":{"why":"Хранить резервное оборудование в неустановленных местах можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"Не путай с горючими материалами у дымовых труб и газоходов: там ответ — «не допускается в любых случаях».","see":[137],"hook":null},"149":{"why":"Хранить изделия и материалы в неустановленных местах можно для ликвидации аварии, технологических нарушений, дефектов — под контролем ответственного за здания и сооружения (п. 199 ПТЭ, приказ № 511).","trap":"Не путай с горючими материалами у дымовых труб и газоходов: там ответ — «не допускается в любых случаях».","see":[137],"hook":null},"150":{"why":"Резервное оборудование топливного хозяйства и оборудование резервного топливного хозяйства, пока источник работает, проверяют не реже раза в месяц — с переходом на резервный насос (п. 202 ПТЭ, приказ № 511).","trap":"Варианты отличаются только сроком: не раз в 2 и не раз в 3 месяца, а раз в месяц.","hook":null,"gist":"Проверка резервного оборудования топливного хозяйства","figure":"не реже 1 раза в месяц"},"151":{"why":"В помещениях топливоподачи организуют систематический контроль загазованности воздуха там, где может скопиться газ (п. 205 ПТЭ, приказ № 511).","trap":"Слово «систематический» есть и в неверном варианте — контролируют загазованность, а не температуру.","hook":null},"152":{"why":"Неверное здесь — утверждение, что в помещениях топливоподачи нужен систематический контроль влажности и температуры (пп. 205, 207 ПТЭ, приказ № 511).","trap":"Систематически контролируют загазованность воздуха — это верно, а про влажность и температуру — нет.","see":[151],"hook":null},"153":{"why":"Объём чаши обвалования надземных резервуаров жидкого топлива — не меньше объёма наибольшего резервуара (п. 210 ПТЭ, приказ № 511).","trap":"В одном слове: не «наименьшего», а «наибольшего» резервуара.","hook":null},"154":{"why":"Гидрозатворы обвалования надземных резервуаров жидкого топлива осматривают раз в смену и чистят, если есть загрязнения (п. 210 ПТЭ, приказ № 511).","trap":"Обрати внимание на срок осмотра: не раз в неделю и не раз в месяц, а раз в смену.","hook":null},"155":{"why":"При сливе из цистерн жидкое топливо подогревают до температуры, указанной в технической документации изготовителя перекачивающего насоса (п. 211 ПТЭ, приказ № 511).","trap":null,"hook":null},"156":{"why":"Предельную температуру жидкого топлива в приёмных ёмкостях и резервуарах задаёт проектная документация (п. 211 ПТЭ, приказ № 511).","trap":null,"hook":null},"157":{"why":"Жидкое топливо (кроме высокосернистых марок) можно подогревать паром, если у цистерн нет устройств для подогрева поверхностным способом (п. 211 ПТЭ, приказ № 511).","trap":null,"hook":null},"158":{"why":"После капитального ремонта резервуара жидкого топлива корректируют таблицу зависимости вместимости от уровня наполнения — при нормированной температуре (п. 212 ПТЭ, приказ № 511).","trap":"Обрати внимание: вместимость — от уровня наполнения, а не от температуры или влажности.","hook":null},"159":{"why":"После реконструкции резервуара жидкого топлива корректируют таблицу зависимости вместимости от уровня наполнения — при нормированной температуре (п. 212 ПТЭ, приказ № 511).","trap":"Обрати внимание: вместимость — от уровня наполнения, а не от температуры или влажности.","hook":null},"160":{"why":"Если у резервуара жидкого топлива изменились форма и объём, корректируют таблицу зависимости вместимости от уровня наполнения — при нормированной температуре (п. 212 ПТЭ, приказ № 511).","trap":"Обрати внимание: вместимость — от уровня наполнения, а не от температуры или влажности.","hook":null},"161":{"why":"После перемещения резервуара жидкого топлива на новое место корректируют таблицу зависимости вместимости от уровня наполнения — при нормированной температуре (п. 212 ПТЭ, приказ № 511).","trap":"Обрати внимание: вместимость — от уровня наполнения, а не от температуры или влажности.","hook":null},"162":{"why":"Вопрос на исключение: после очередного осмотра резервуара таблицу вместимости от уровня наполнения не корректируют (п. 212 ПТЭ, приказ № 511).","trap":null,"hook":null},"163":{"why":"Техническое состояние стационарных автоматических газоанализаторов, а также звуковой и световой сигнализации об опасной концентрации паров в воздухе помещений проверяют каждую смену (п. 213 ПТЭ, приказ № 511).","trap":"Не путай с сигнализацией по температуре и давлению топлива: её проверяют еженедельно, а газоанализаторы — ежесменно.","see":[171],"hook":null},"164":{"why":"Техническое состояние резервуаров и приёмных ёмкостей жидкого топлива обследуют не реже раза в 5 лет (п. 215 ПТЭ, приказ № 511).","trap":"Варианты отличаются только цифрой: не 7 и не 10 лет, а 5 лет.","hook":"Резервуары — раз в пятилетку.","gist":"Обследование резервуаров жидкого топлива","figure":"не реже раза в 5 лет"},"165":{"why":"Фильтры жидкого топлива чистят паровой продувкой, вручную или химически, когда перепад давления на них вырос на 50% по сравнению с чистым состоянием при той же нагрузке (п. 219 ПТЭ, приказ № 511).","trap":"Два подвоха: 50%, а не 30%, и «при той же нагрузке», а не «при меньшей».","hook":"Фильтр — плюс 50% перепада, подогреватель — минус 30% мощности.","gist":"Когда чистить фильтры жидкого топлива","figure":"перепад вырос на 50% при той же нагрузке"},"166":{"why":"Обжигать фильтрующую сетку при чистке фильтров жидкого топлива нельзя ни в каком случае (п. 219 ПТЭ, приказ № 511).","trap":null,"hook":null},"167":{"why":"Подогреватели топлива чистят, когда их тепловая мощность упала на 30% от мощности в чистом состоянии при той же нагрузке (п. 219 ПТЭ, приказ № 511).","trap":"Два подвоха: 30%, а не 50%, и «при той же нагрузке», а не «при меньшей».","hook":"Подогреватель — минус 30% мощности, фильтр — плюс 50% перепада.","gist":"Когда чистить подогреватели топлива","figure":"мощность упала на 30% при той же нагрузке"},"168":{"why":"Лишнее здесь — подогрев: при выводе в ремонт трубопроводов и оборудования подачи жидкого топлива его не проводят (п. 220 ПТЭ, приказ № 511).","trap":null,"hook":null},"169":{"why":"Во время пропаривания резервуара заземляют паропровод и металлические части парового рукава (п. 220 ПТЭ, приказ № 511).","trap":null,"hook":null},"170":{"why":"Перед включением резервуара с жидким топливом в работу пробу на влажность берут из придонного слоя, но не более 0,5 м (п. 220 ПТЭ, приказ № 511).","trap":"Два подвоха: слой придонный, а не верхний, и «не более 0,5 м», а не «не менее».","hook":null,"gist":"Проба топлива на влажность","figure":"из придонного слоя, не более 0,5 м"},"171":{"why":"Сигнализацию предельного повышения и понижения температуры и понижения давления жидкого топлива, которое подают к котлам, проверяют раз в неделю (п. 221 ПТЭ, приказ № 511).","trap":"Не путай с газоанализаторами: их проверяют ежесменно, а эту сигнализацию — еженедельно.","see":[163],"hook":null},"172":{"why":"Правильность показаний дистанционных уровнемеров и приборов для измерения температуры топлива в резервуарах и приёмных ёмкостях, выведенных на щит управления, проверяют раз в неделю (п. 221 ПТЭ, приказ № 511).","trap":"Не путай с газоанализаторами: их проверяют ежесменно, а уровнемеры и приборы на щите — еженедельно.","see":[163],"hook":null},"173":{"why":"Вопрос на исключение: при резких изменениях давления газа выводить котельные установки из работы — неверная мера (п. 223 ПТЭ, приказ № 511).","trap":null,"hook":null},"174":{"why":"Вопрос на исключение: неверно, что при освидетельствовании котлов и металлоконструкций их каркасов проводят только внутренний осмотр котла и его элементов (п. 225 ПТЭ, приказ № 511).","trap":"Всё решает слово «только».","hook":null},"175":{"why":"При техническом освидетельствовании котлы осматривают снаружи и изнутри не реже раза в четыре года, если в документации изготовителя не предусмотрены иные сроки (п. 226 ПТЭ, приказ № 511).","trap":"Не путай с гидроиспытанием: оно раз в восемь лет, а наружный и внутренний осмотры — раз в четыре года.","see":[176],"hook":"Четыре года — глазами, восемь — водой.","gist":"Осмотры котла при освидетельствовании","figure":"не реже 1 раза в четыре года"},"176":{"why":"Гидравлическое испытание котлов на прочность и плотность при освидетельствовании — не реже раза в восемь лет, если в документации изготовителя не предусмотрены иные сроки (п. 226 ПТЭ, приказ № 511).","trap":"Варианты отличаются только сроком: не десять и не пятнадцать, а восемь лет.","hook":"Четыре года — глазами, восемь — водой.","gist":"Гидроиспытание котла при освидетельствовании","figure":"не реже 1 раза в восемь лет"},"177":{"why":"Вопрос на исключение: неверно, что ответственный за исправное состояние и безопасную эксплуатацию обязан осматривать котёл снаружи и изнутри не реже 1 раза в пять лет (п. 228 ПТЭ, приказ № 511).","trap":"Осмотры перед плановым ремонтом и после него — верно, а ложное здесь — «не реже 1 раза в пять лет».","hook":null,"gist":"Осмотры котла ответственным (на исключение)","figure":"неверно: «не реже 1 раза в пять лет»"},"178":{"why":"Вопрос на исключение: неверно, что ответственный обязан проводить гидроиспытание рабочим давлением каждый раз после устранения дефектов металлоконструкций котла (пп. 227–229 ПТЭ, приказ № 511).","trap":"После вскрытия барабана и после ремонта котла — верно, а ложное — «после устранения дефектов металлоконструкций».","hook":null},"179":{"why":"Вопрос на исключение: неверно, что внеочередное освидетельствование котлов нужно после ремонта без сварки, наплавки и термообработки элементов под давлением (п. 228 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «без применения сварки, наплавки, термической обработки».","hook":null},"180":{"why":"Если при освидетельствовании котла нашли поверхностные трещины или неплотности, то перед их подваркой удаляют участки, поражённые коррозией (п. 231 ПТЭ, приказ № 511).","trap":null,"hook":null},"181":{"why":"Периодическое техническое освидетельствование металлоконструкций каркаса котла проводят с периодичностью из технической документации изготовителя (п. 232 ПТЭ, приказ № 511).","trap":null,"hook":null},"182":{"why":"Вопрос на исключение: внеочередное освидетельствование металлоконструкций котла не проводят после чрезвычайной ситуации, которая не могла повлиять на их состояние и несущую способность (п. 232 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «не могло оказать влияние».","hook":null},"183":{"why":"Если в топке и (или) газоходах котла были взрывы (хлопки), проводят внеочередное техническое освидетельствование металлоконструкций котла (п. 232 ПТЭ, приказ № 511).","trap":null,"hook":null},"184":{"why":"Если металлоконструкции котла попали под высокие температуры из-за неисправной обмуровки или при пожаре, проводят их внеочередное техническое освидетельствование (п. 232 ПТЭ, приказ № 511).","trap":null,"hook":null},"185":{"why":"Если чрезвычайная ситуация могла повлиять на состояние и несущую способность металлоконструкций котла, проводят их внеочередное техническое освидетельствование (п. 232 ПТЭ, приказ № 511).","trap":null,"hook":null},"186":{"why":"В самоопорных котлах, то есть без несущего каркаса, освидетельствуют опорные конструкции (узлы) поверхностей нагрева (п. 234 ПТЭ, приказ № 511).","trap":null,"hook":null},"187":{"why":"Периодическое освидетельствование сосудов под давлением проводят так часто, как указал изготовитель (разработчик проекта) в руководстве (инструкции) по эксплуатации (п. 235 ПТЭ, приказ № 511).","trap":null,"hook":null},"188":{"why":"Если в руководстве (инструкции) по эксплуатации нет указаний изготовителя, сосуды под давлением освидетельствуют не реже 1 раза в год (п. 235 ПТЭ, приказ № 511).","trap":"Не раз в 3 года и не каждые 6 месяцев, а раз в год.","hook":"Инструкция молчит — значит, раз в год.","gist":"Освидетельствование сосудов, если инструкция молчит","figure":"не реже 1 раза в год"},"189":{"why":"Внеочередное освидетельствование сосуда не проводят после чрезвычайной ситуации, которая не могла повлиять на его состояние (п. 236 ПТЭ, приказ № 511).","trap":"Всё решает оговорка «не могло оказать влияние».","hook":null},"190":{"why":"Если сосуд под давлением не эксплуатировали больше 12 месяцев, проводят его внеочередное техническое освидетельствование (п. 236 ПТЭ, приказ № 511).","trap":null,"hook":null},"191":{"why":"После ремонта сосуда со сваркой, наплавкой, термообработкой элементов под давлением проводят его внеочередное техническое освидетельствование (п. 236 ПТЭ, приказ № 511).","trap":null,"hook":null},"192":{"why":"Минимальное пробное давление при гидроиспытании сосудов на прочность и плотность — 1,25 рабочего (п. 240 ПТЭ, приказ № 511).","trap":"Не 1,5, а 1,25 рабочего; «по документации изготовителя или расчётам» — это про максимум.","see":[193],"hook":"1,25 — это рабочее плюс четверть.","gist":"Минимальное пробное давление сосудов","figure":"1,25 рабочего давления"},"193":{"why":"Максимальное пробное давление при гидроиспытании сосудов задают по технической документации изготовителя или по расчётам на прочность (п. 240 ПТЭ, приказ № 511).","trap":"Не путай с минимумом: он 1,25 рабочего, а максимум — по документации изготовителя или расчётам.","see":[192],"hook":null},"194":{"why":"При рабочем давлении не выше 0,5 МПа минимальное пробное давление котлов, экономайзеров и трубопроводов в пределах котла — 1,5 рабочего, но не меньше 0,2 МПа (п. 243 ПТЭ, приказ № 511).","trap":"Не путай с рабочим давлением выше 0,5 МПа: там 1,25 рабочего и рабочее плюс 0,3 МПа, а здесь 1,5 рабочего и 0,2 МПа.","see":[195],"hook":"Не выше 0,5 МПа — 1,5 рабочего: пятёрка к пятёрке.","gist":"Минимальное пробное давление котла, рабочее ≤ 0,5 МПа","figure":"1,5 рабочего, но не менее 0,2 МПа"},"195":{"why":"При рабочем давлении выше 0,5 МПа минимальное пробное давление котлов, экономайзеров и трубопроводов в пределах котла — 1,25 рабочего, но не меньше рабочего плюс 0,3 МПа (п. 243 ПТЭ, приказ № 511).","trap":"Не путай с рабочим давлением не выше 0,5 МПа: там 1,5 рабочего и 0,2 МПа, а здесь 1,25 рабочего и рабочее плюс 0,3 МПа.","see":[194],"hook":"Давление выше — коэффициент ниже: 1,25 вместо 1,5.","gist":"Минимальное пробное давление котла, рабочее > 0,5 МПа","figure":"1,25 рабочего, но не менее рабочего плюс 0,3 МПа"},"196":{"why":"Лишнее здесь — «предупреждение повреждения металлоконструкций основания котлов»: это не цель водоподготовки и водно-химического режима (п. 275 ПТЭ, приказ № 511).","trap":null,"hook":null},"197":{"why":"Лишнее здесь — потери напора по тракту сетевой воды (в котлах, трубопроводах, подогревателях): в режимных картах по водоподготовке их не указывают (п. 279 ПТЭ, приказ № 511).","trap":null,"hook":null},"198":{"why":"Накипеобразующие свойства сетевой воды оценивают по карбонатному индексу (п. 281 ПТЭ, приказ № 511).","trap":null,"hook":null},"199":{"why":"Исходную воду для подпитки открытых систем коагулируют, если цветность пробы при кипячении в течение 20 минут превышает 20 градусов (п. 285 ПТЭ, приказ № 511).","trap":"В цифре: порог 20 градусов, а не 10 и не 15; 20 минут кипячения — во всех вариантах.","hook":"Двадцать на двадцать: 20 минут кипячения — 20 градусов.","gist":"Коагуляция исходной воды для открытых систем","figure":"цветность выше 20 градусов при кипячении 20 минут"},"200":{"why":"Лишнее здесь — инструкции по охране труда: по итогам режимно-наладочных испытаний водоподготовки их не пересматривают и не переутверждают (п. 295 ПТЭ, приказ № 511).","trap":null,"hook":null},"201":{"why":"По всему периметру бакового хозяйства нужна обваловка высотой не меньше 0,5 м (п. 305 ПТЭ, приказ № 511).","trap":"В цифре: не 0,4 и не 0,3 м, а 0,5 м.","hook":"Вал вокруг баков — примерно по колено, полметра.","gist":"Высота обваловки баков-аккумуляторов","figure":"не менее 0,5 м"},"202":{"why":"Объём чаши обвалования — не меньше объёма самого большого бака-аккумулятора (п. 305 ПТЭ, приказ № 511).","trap":"Обрати внимание: не «наименьшего», а «наибольшего» бака.","hook":null},"203":{"why":"Бак-аккумулятор выдержал испытания, если через 24 часа нет течи ни на поверхности, ни по краям днища, а уровень воды не снижался (п. 305 ПТЭ, приказ № 511).","trap":"Не 12 и не 36 часов, а 24, и уровень не снижался — неверные варианты допускают снижение до 5%.","hook":"Сутки без течи — и уровень на месте.","gist":"Испытание бака-аккумулятора на плотность и прочность","figure":"24 часа без течи, уровень не снижался"},"204":{"why":"Акт по гидроиспытаниям, проверке основания и равномерности осадки бака-аккумулятора утверждает технический руководитель эксплуатирующей организации (п. 313 ПТЭ, приказ № 511).","trap":"Обрати внимание: не просто «руководитель», а «технический руководитель».","hook":null},"205":{"why":"Конструкции и основание баков-аккумуляторов, компенсаторы трубопроводов, вестовые и переливные трубы осматривают ежегодно при подготовке к отопительному периоду (п. 318 ПТЭ, приказ № 511).","trap":"Не путай с диагностированием бака: оно не реже 1 раза в 3 года, а осмотр — ежегодно.","see":[206],"hook":null},"206":{"why":"Техническое диагностирование бака-аккумулятора — замеры толщин стенок, дефектоскопия, проверка металла и сварных соединений — проводят не реже раза в 3 года (п. 319 ПТЭ, приказ № 511).","trap":"В цифре: не раз в год и не раз в 2 года, а раз в 3 года.","hook":"Осмотр — каждый год, диагностирование — раз
